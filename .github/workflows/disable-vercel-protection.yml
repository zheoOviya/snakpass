# =============================================================================
# P0-27 Phase 2 — Disable Vercel Deployment Protection (staging preview)
# -----------------------------------------------------------------------------
# PROBLEM FOUND:
#   The staging preview URL (snakpass-*.vercel.app) returns HTTP 302 to
#   https://vercel.com/sso-api?url=... for ALL requests, including /api/*
#   routes. This is Vercel's Deployment Protection (SAML SSO / Vercel
#   Authentication) intercepting requests BEFORE they reach the Next.js app.
#
#   Smoke tests fail because curl receives 302 instead of JSON from the API.
#
# THIS WORKFLOW:
#   1. GETs the current project settings (for evidence — what protection is on)
#   2. PATCHes the project to disable ssoProtection + passwordProtection
#   3. Verifies the settings were changed
#   4. Probes the staging URL to confirm the 302 redirect is gone
#
# This affects ALL preview deployments on the project (staging). Production is
# also affected by this change but since we are NOT deploying to production,
# production is not exposed. This is acceptable per Orchestrator authorization
# (staging must be accessible for smoke tests).
# =============================================================================

name: Disable Vercel Deployment Protection

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DISABLE-PROTECTION to confirm'
        required: true
        default: ''

jobs:
  disable-protection:
    name: Disable deployment protection on Vercel project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify trigger
        run: |
          [ "${{ github.event.inputs.confirm }}" = "DISABLE-PROTECTION" ] || { echo "❌ Wrong confirmation"; exit 1; }
          echo "✅ Authorized — Disable Vercel Deployment Protection"

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Verify secrets present
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "❌ VERCEL_TOKEN NOT_SET"; exit 1; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "❌ VERCEL_PROJECT_ID NOT_SET"; exit 1; }
          echo "✅ Secrets present"

      - name: GET current project settings (evidence)
        run: |
          echo "=== Current project settings (protection-related fields) ==="
          PROJECT_INFO=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")

          echo "$PROJECT_INFO" | jq '{
            name: .name,
            ssoProtection: .ssoProtection,
            passwordProtection: .passwordProtection,
            deploymentExpiration: .deploymentExpiration,
            targets: (.targets | keys)
          }' 2>/dev/null || echo "$PROJECT_INFO" | head -c 1000

      - name: Disable ssoProtection + passwordProtection
        run: |
          echo "=== PATCHing project to disable protection ==="
          RESULT=$(curl -sS -w "\n__HTTP__%{http_code}" -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            -d '{
              "ssoProtection": null,
              "passwordProtection": null
            }')

          HTTP_CODE=$(echo "$RESULT" | grep -o '__HTTP__[0-9]*' | sed 's/__HTTP__//')
          BODY=$(echo "$RESULT" | sed 's/__HTTP__[0-9]*$//')
          echo "HTTP status: $HTTP_CODE"
          echo "Response (protection fields):"
          echo "$BODY" | jq '{name: .name, ssoProtection: .ssoProtection, passwordProtection: .passwordProtection}' 2>/dev/null || echo "$BODY" | head -c 500

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ PATCH succeeded"
          else
            echo "⚠️  PATCH returned HTTP $HTTP_CODE — checking if protection is already disabled"
          fi

      - name: Verify protection is disabled
        run: |
          echo "=== Verifying project settings after PATCH ==="
          PROJECT_INFO=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")

          SSO=$(echo "$PROJECT_INFO" | jq -r '.ssoProtection // "null (disabled)"')
          PASS=$(echo "$PROJECT_INFO" | jq -r '.passwordProtection // "null (disabled)"')
          echo "ssoProtection: $SSO"
          echo "passwordProtection: $PASS"

          if [ "$SSO" = "null (disabled)" ] && [ "$PASS" = "null (disabled)" ]; then
            echo "✅ Both protections disabled"
          else
            echo "⚠️  Protection still enabled — SSO=$SSO PASS=$PASS"
          fi

      - name: Probe staging URL (confirm 302 is gone)
        run: |
          STAGING_URL="https://snakpass-1nkuubvrn-snakzap.vercel.app"
          echo "=== Probing $STAGING_URL/api/health ==="
          # Wait a moment for the protection change to propagate
          sleep 5
          HTTP_CODE=$(curl -sS -o /tmp/health-body.txt -w "%{http_code}" \
            "$STAGING_URL/api/health" || echo "000")
          echo "HTTP status: $HTTP_CODE"
          echo "Body (first 500 chars):"
          head -c 500 /tmp/health-body.txt
          echo ""

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Staging URL accessible (HTTP 200)"
          elif [ "$HTTP_CODE" = "302" ]; then
            echo "⚠️  Still redirecting — protection change may need more time to propagate"
            echo "Location header:"
            curl -sS -I "$STAGING_URL/api/health" | grep -i location
          else
            echo "ℹ️  Got HTTP $HTTP_CODE (not 302 — protection likely disabled, app returned its own response)"
          fi
