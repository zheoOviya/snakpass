# Wave-4 Sub-Wave 4a — Apply Staging Migration
# Adds processedBy + processingNotes columns to WebhookEvent table (Class-2 ADDITIVE)

name: Wave-4 4a — Apply Staging Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-WAVE4-4A to confirm'
        required: true
        default: ''

jobs:
  migrate:
    name: Apply Wave-4 4a schema migration to staging Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zmzqqcyapcezmaqvuzzd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify trigger
        run: |
          [ "${{ github.event.inputs.confirm }}" = "APPLY-WAVE4-4A" ] || { echo "❌ Wrong confirmation"; exit 1; }
          echo "✅ Authorized — Wave-4 Sub-Wave 4a staging migration"

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Verify secrets present
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "❌ SUPABASE_ACCESS_TOKEN NOT_SET"; exit 1; }
          echo "✅ Secrets present"

      - name: Apply migration via Supabase Management API
        run: |
          echo "=== Applying Wave-4 4a migration to staging Supabase ==="
          RESULT=$(jq -n --rawfile sql prisma/scripts/wave4-subwave-4a-migration.sql '{query: $sql}' | \
            curl -sS -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -d @-)
          echo "$RESULT"
          echo "=== Migration complete ==="

      - name: Verify schema (processedBy + processingNotes columns exist)
        run: |
          echo "=== Verifying columns exist ==="
          VERIFY_SQL='SELECT (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''IdempotencyKey'\'' AND column_name = '\''requestHash'\'') AS idempotency_requesthash, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''WebhookEvent'\'' AND column_name = '\''processedBy'\'') AS webhook_processedby, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''WebhookEvent'\'' AND column_name = '\''processingNotes'\'') AS webhook_processingnotes;'
          RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$VERIFY_SQL" '{query: $q}')")
          echo "$RESULT" | jq '.' 2>/dev/null || echo "$RESULT"
          echo "=== Verification complete ==="
