name: "Sub-Wave 2d - Reconciliation Evidence"

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging URL'
        required: true

jobs:
  reconciliation-evidence:
    name: 2d-4/2d-5/2d-6 orphan detection + negative control + evidence JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zmzqqcyapcezmaqvuzzd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: "2d-4/2d-5/2d-6 Reconciliation Evidence"
        env:
          STAGING_URL: ${{ inputs.staging_url }}
        run: |
          STAGING_URL=$(echo "${{ inputs.staging_url }}" | sed 's/\/$//')
          APP_PASSWORD="CHANGE_ME_IN_PRODUCTION_USE_SECRET_MANAGER"
          ENCODED_PW=$(jq -rn --arg pw "$APP_PASSWORD" '$pw|@uri')
          PUBLISHER_DB_URL="postgresql://snakzap_app.zmzqqcyapcezmaqvuzzd:$ENCODED_PW@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=1"

          query_db() {
            local sql="$1"
            echo "$sql" > /tmp/query.sql
            jq -n --rawfile sql /tmp/query.sql '{query: $sql}' | \
              curl -sS -X POST \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -d @-
          }

          run_evaluator() {
            export DATABASE_URL="$PUBLISHER_DB_URL"
            export ALERT_INTERVAL_MS="999999999"
            timeout 10 bun run mini-services/alert-evaluator/index.ts 2>&1 || true
          }

          echo "=================================================="
          echo "  2d-5 NEGATIVE CONTROL (healthy state, no orphans)"
          echo "=================================================="
          echo ""
          echo "=== Step 1: Run alert evaluator on healthy state ==="
          EVAL_OUTPUT=$(run_evaluator)
          echo "$EVAL_OUTPUT" | tail -5

          ORPHAN_BUSINESS_FIRED=$(echo "$EVAL_OUTPUT" | grep -c "orphan-business-entity" || echo "0")
          ORPHAN_OUTBOX_FIRED=$(echo "$EVAL_OUTPUT" | grep -c "orphan-outbox-event" || echo "0")
          echo ""
          echo "orphan-business-entity fired: $ORPHAN_BUSINESS_FIRED (expected: 0 — healthy state)"
          echo "orphan-outbox-event fired: $ORPHAN_OUTBOX_FIRED (expected: 0 — healthy state)"

          NEGATIVE_OK="false"
          if [ "$ORPHAN_BUSINESS_FIRED" = "0" ] && [ "$ORPHAN_OUTBOX_FIRED" = "0" ]; then
            NEGATIVE_OK="true"
            echo "PASS: healthy state — no orphan alerts fired"
          else
            echo "FAIL: orphan alerts fired on healthy state"
          fi

          echo ""
          echo "=================================================="
          echo "  2d-4a ORPHAN BUSINESS ENTITY (order without outbox)"
          echo "=================================================="
          echo ""

          echo "=== Step 1: Create an order WITHOUT an outbox event ==="
          ORPHAN_ORDER_ID="orphan-order-$(date +%s)"
          printf 'INSERT INTO "Order" (id, "userId", "restaurantId", status, "totalAmount", "pickupOtp", "isCatering", "itemsCount", "statusHistory", version, "createdAt", "updatedAt") VALUES ('"'"'%s'"'"', '"'"'orphan-test-user'"'"', '"'"'rest-001'"'"', '"'"'CONFIRMED'"'"', 6000, '"'"'000000'"'"', false, 1, '"'"'[]'"'"', 0, NOW(), NOW());' "$ORPHAN_ORDER_ID" > /tmp/orphan_order.sql
          query_db "$(cat /tmp/orphan_order.sql)" > /dev/null 2>&1
          echo "Created orphan order: $ORPHAN_ORDER_ID"

          echo ""
          echo "=== Step 2: Run alert evaluator ==="
          EVAL_OUTPUT2=$(run_evaluator)
          echo "$EVAL_OUTPUT2" | tail -5

          ORPHAN_BUS_FIRED=$(echo "$EVAL_OUTPUT2" | grep -c "orphan-business-entity" || echo "0")
          echo ""
          echo "orphan-business-entity fired: $ORPHAN_BUS_FIRED (expected: >0 — orphan detected)"

          ORPHAN_BUS_OK="false"
          if [ "$ORPHAN_BUS_FIRED" -gt 0 ]; then
            ORPHAN_BUS_OK="true"
            echo "PASS: orphan-business-entity alert fired"
          else
            echo "FAIL: orphan-business-entity alert did not fire"
          fi

          echo ""
          echo "=== Cleanup: delete orphan order ==="
          query_db "DELETE FROM \"Order\" WHERE id = '$ORPHAN_ORDER_ID';" > /dev/null 2>&1

          echo ""
          echo "=================================================="
          echo "  2d-4b ORPHAN OUTBOX EVENT (outbox without order)"
          echo "=================================================="
          echo ""

          echo "=== Step 1: Create an outbox event WITHOUT a corresponding order ==="
          ORPHAN_OB_ID="orphan-outbox-$(date +%s)"
          printf 'INSERT INTO "Outbox" (id, "eventId", "eventType", "aggregateType", "aggregateId", payload, status, attempts, "createdAt") VALUES (gen_random_uuid()::text, '"'"'%s'"'"', '"'"'ORDER_CREATED'"'"', '"'"'Order'"'"', '"'"'nonexistent-order-123'"'"', '"'"'{}'"'"', '"'"'PUBLISHED'"'"', 0, NOW());' "$ORPHAN_OB_ID" > /tmp/orphan_ob.sql
          query_db "$(cat /tmp/orphan_ob.sql)" > /dev/null 2>&1
          echo "Created orphan outbox event: $ORPHAN_OB_ID (aggregateId=nonexistent-order-123)"

          echo ""
          echo "=== Step 2: Run alert evaluator ==="
          EVAL_OUTPUT3=$(run_evaluator)
          echo "$EVAL_OUTPUT3" | tail -5

          ORPHAN_OB_FIRED=$(echo "$EVAL_OUTPUT3" | grep -c "orphan-outbox-event" || echo "0")
          echo ""
          echo "orphan-outbox-event fired: $ORPHAN_OB_FIRED (expected: >0 — orphan detected)"

          ORPHAN_OB_ALERT_OK="false"
          if [ "$ORPHAN_OB_FIRED" -gt 0 ]; then
            ORPHAN_OB_ALERT_OK="true"
            echo "PASS: orphan-outbox-event alert fired"
          else
            echo "FAIL: orphan-outbox-event alert did not fire"
          fi

          echo ""
          echo "=== Cleanup: delete orphan outbox event ==="
          query_db "DELETE FROM \"Outbox\" WHERE \"eventId\" = '$ORPHAN_OB_ID';" > /dev/null 2>&1

          echo ""
          echo "=================================================="
          echo "  2d-6 EVIDENCE SUMMARY"
          echo "=================================================="
          echo ""
          echo "  2d-5 Negative Control:    $([ "$NEGATIVE_OK" = "true" ] && echo "PASS" || echo "FAIL")"
          echo "  2d-4a Orphan Business:   $([ "$ORPHAN_BUS_OK" = "true" ] && echo "PASS" || echo "FAIL")"
          echo "  2d-4b Orphan Outbox:     $([ "$ORPHAN_OB_ALERT_OK" = "true" ] && echo "PASS" || echo "FAIL")"
          echo ""

          ALL_OK="false"
          if [ "$NEGATIVE_OK" = "true" ] && [ "$ORPHAN_BUS_OK" = "true" ] && [ "$ORPHAN_OB_ALERT_OK" = "true" ]; then
            ALL_OK="true"
          fi

          jq -n \
            --argjson ok "$ALL_OK" \
            --arg negOk "$NEGATIVE_OK" \
            --arg busOk "$ORPHAN_BUS_OK" \
            --arg obOk "$ORPHAN_OB_ALERT_OK" \
            --arg orphanOrderId "$ORPHAN_ORDER_ID" \
            --arg orphanObId "$ORPHAN_OB_ID" \
            --arg stagingUrl "$STAGING_URL" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              ok: $ok,
              timestamp: $timestamp,
              stagingUrl: $stagingUrl,
              tests: {
                "2d-5-negative-control": {
                  ok: ($negOk == "true"),
                  description: "Healthy state (no orphans) -> no orphan alerts fire"
                },
                "2d-4a-orphan-business": {
                  ok: ($busOk == "true"),
                  description: "Order without outbox event -> orphan-business-entity alert fires",
                  orphanOrderId: $orphanOrderId
                },
                "2d-4b-orphan-outbox": {
                  ok: ($obOk == "true"),
                  description: "Outbox event without order -> orphan-outbox-event alert fires",
                  orphanOutboxId: $orphanObId
                }
              }
            }' > 2d-evidence.json

          echo "=== Evidence JSON ==="
          cat 2d-evidence.json | jq '.'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subwave-2d-reconciliation-evidence
          path: 2d-evidence.json
          retention-days: 90
