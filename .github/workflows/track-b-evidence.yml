# =============================================================================
# Wave-1 Track B — Evidence Closure (Authenticated)
# -----------------------------------------------------------------------------
# Runs the Track B evidence script against the staging URL with the Supabase
# access token from GitHub secrets. Captures the JSON evidence as an artifact.
# =============================================================================

name: Track B — Evidence Closure

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging URL (e.g. https://snakpass-xxx-snakzap.vercel.app)'
        required: true

jobs:
  track-b-evidence:
    name: Run Track B Evidence Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Run Track B evidence script
        run: |
          chmod +x scripts/track-b-evidence.sh
          ./scripts/track-b-evidence.sh "${{ inputs.staging_url }}" 2>&1 | tee track-b-output.txt

          # Extract the JSON evidence (last JSON block in the output)
          grep -A 100 '^{.*}$' track-b-output.txt | tail -n +1 > track-b-evidence.json
          echo "=== Track B Evidence JSON ==="
          cat track-b-evidence.json | jq '.' 2>/dev/null || cat track-b-evidence.json

      - name: Upload Track B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-b-evidence
          path: |
            track-b-evidence.json
            track-b-output.txt
          retention-days: 90
          if-no-files-found: warn
