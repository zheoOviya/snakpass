# DEV-001 — Evidence Hardening Gate (v2)
# Simpler approach: use Management API SQL endpoint to execute
# individual SET ROLE + operation statements one at a time.

name: DEV-001 Evidence Hardening v2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type HARDEN-EVIDENCE to confirm'
        required: true
        default: ''

jobs:
  harden-evidence:
    name: Runtime Tamper Test as snakzap_app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zmzqqcyapcezmaqvuzzd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify trigger
        run: |
          [ "${{ github.event.inputs.confirm }}" = "HARDEN-EVIDENCE" ] || { echo "❌ Wrong confirmation"; exit 1; }
          echo "✅ Authorized — DEV-001 Evidence Hardening v2"

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Execute SQL via Management API
        run: |
          set +e  # Don't exit on individual SQL failures — capture them

          API_URL="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          AUTH="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"

          run_sql() {
            local query="$1"
            local label="$2"
            echo "--- $label ---"
            RESULT=$(curl -sS -X POST \
              -H "$AUTH" \
              -H "Content-Type: application/json" \
              "$API_URL" \
              -d "$(jq -n --arg q "$query" '{query: $q}')")
            echo "$RESULT"
            echo "$RESULT" > "/tmp/result_$(echo "$label" | tr ' ' '_').json"
            echo ""
          }

          echo "═══════════════════════════════════════════════════════════════"
          echo "  DEV-001 EVIDENCE HARDENING — RUNTIME TAMPER TESTS"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          # === Step 0: Verify roles exist ===
          echo "=== Step 0: Verify roles exist ==="
          run_sql "SELECT rolname FROM pg_roles WHERE rolname IN ('snakzap_app', 'snakzap_admin') ORDER BY rolname;" "Step 0 roles"

          # === Step 1: Insert test entry (as superuser via Management API) ===
          echo "=== Step 1: Insert test entry (as superuser) ==="
          run_sql "INSERT INTO \"AuditLog\" (id, actorId, actorRole, action, metadata, createdAt, prevHash, hash) VALUES ('tamper-test-001', NULL, 'SYSTEM', 'TAMPER_TEST', '{\"test\": true}', NOW(), 'GENESIS', 'test-hash'); SELECT 'inserted' AS status;" "Step 1 insert test entry"

          # === Step 2: Test INSERT as snakzap_app ===
          # Use a DO block that catches the exception
          echo "=== Step 2: INSERT as snakzap_app (should be ALLOWED) ==="
          run_sql "DO \$\$ BEGIN SET ROLE snakzap_app; INSERT INTO \"AuditLog\" (id, actorId, actorRole, action, metadata, createdAt, prevHash, hash) VALUES ('tamper-test-app-001', NULL, 'SYSTEM', 'TAMPER_TEST_APP_INSERT', '{\"test\": \"app_insert\"}', NOW(), 'GENESIS', 'app-hash'); RESET ROLE; RAISE NOTICE 'RESULT: ALLOWED'; EXCEPTION WHEN OTHERS THEN RESET ROLE; RAISE NOTICE 'RESULT: DENIED - %', SQLERRM; END \$\$;" "Step 2 INSERT as app"

          # === Step 3: Test SELECT as snakzap_app ===
          echo "=== Step 3: SELECT as snakzap_app (should be ALLOWED) ==="
          run_sql "DO \$\$ BEGIN SET ROLE snakzap_app; PERFORM COUNT(*) FROM \"AuditLog\"; RESET ROLE; RAISE NOTICE 'RESULT: ALLOWED'; EXCEPTION WHEN OTHERS THEN RESET ROLE; RAISE NOTICE 'RESULT: DENIED - %', SQLERRM; END \$\$;" "Step 3 SELECT as app"

          # === Step 4: Test UPDATE as snakzap_app (should be DENIED) ===
          echo "=== Step 4: UPDATE as snakzap_app (should be DENIED) ==="
          run_sql "DO \$\$ BEGIN SET ROLE snakzap_app; UPDATE \"AuditLog\" SET action = 'TAMPERED' WHERE id = 'tamper-test-001'; RESET ROLE; RAISE NOTICE 'RESULT: ALLOWED — WORM VIOLATION'; EXCEPTION WHEN insufficient_privilege THEN RESET ROLE; RAISE NOTICE 'RESULT: DENIED (insufficient_privilege)'; WHEN OTHERS THEN RESET ROLE; RAISE NOTICE 'RESULT: DENIED - %', SQLERRM; END \$\$;" "Step 4 UPDATE as app"

          # === Step 5: Test DELETE as snakzap_app (should be DENIED) ===
          echo "=== Step 5: DELETE as snakzap_app (should be DENIED) ==="
          run_sql "DO \$\$ BEGIN SET ROLE snakzap_app; DELETE FROM \"AuditLog\" WHERE id = 'tamper-test-001'; RESET ROLE; RAISE NOTICE 'RESULT: ALLOWED — WORM VIOLATION'; EXCEPTION WHEN insufficient_privilege THEN RESET ROLE; RAISE NOTICE 'RESULT: DENIED (insufficient_privilege)'; WHEN OTHERS THEN RESET ROLE; RAISE NOTICE 'RESULT: DENIED - %', SQLERRM; END \$\$;" "Step 5 DELETE as app"

          # === Step 6: Verify privileges ===
          echo "=== Step 6: Privilege verification ==="
          run_sql "SELECT grantee, privilege_type FROM information_schema.role_table_grants WHERE table_name = 'AuditLog' AND grantee IN ('snakzap_app', 'snakzap_admin') ORDER BY grantee, privilege_type;" "Step 6 privileges"

          # === Step 7: Cleanup ===
          echo "=== Step 7: Cleanup ==="
          run_sql "DELETE FROM \"AuditLog\" WHERE id LIKE 'tamper-test-%';" "Step 7 cleanup"

          # === Build summary ===
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  RUNTIME TAMPER TEST SUMMARY"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "Test 1 — INSERT as snakzap_app:  $(cat /tmp/result_Step_2_INSERT_as_app.json 2>/dev/null | jq -r 'if type == "array" then .[0].NOTICE // .[0].message // "unknown" else .message // "unknown" end' 2>/dev/null)"
          echo "Test 2 — SELECT as snakzap_app:  $(cat /tmp/result_Step_3_SELECT_as_app.json 2>/dev/null | jq -r 'if type == "array" then .[0].NOTICE // .[0].message // "unknown" else .message // "unknown" end' 2>/dev/null)"
          echo "Test 3 — UPDATE as snakzap_app:  $(cat /tmp/result_Step_4_UPDATE_as_app.json 2>/dev/null | jq -r 'if type == "array" then .[0].NOTICE // .[0].message // "unknown" else .message // "unknown" end' 2>/dev/null)"
          echo "Test 4 — DELETE as snakzap_app:  $(cat /tmp/result_Step_5_DELETE_as_app.json 2>/dev/null | jq -r 'if type == "array" then .[0].NOTICE // .[0].message // "unknown" else .message // "unknown" end' 2>/dev/null)"
          echo ""
          echo "Privilege configuration:"
          cat /tmp/result_Step_6_privileges.json 2>/dev/null | jq -r 'if type == "array" then .[] | "  \(.grantee): \(.privilege_type)" else .message end' 2>/dev/null
          echo ""
          echo "═══════════════════════════════════════════════════════════════"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-001-hardened-evidence-v2
          path: /tmp/result_*.json
          retention-days: 365
