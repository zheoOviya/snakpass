          CLEAN_SQL=$(printf 'DELETE FROM "LedgerEntry" WHERE "paymentId" = '\''%s'\''; DELETE FROM "Outbox" WHERE "aggregateId" = '\''%s'\''; DELETE FROM "Refund" WHERE "id" = '\''%s'\''; DELETE FROM "IdempotencyKey" WHERE "key" = '\''%s'\''; DELETE FROM "Payment" WHERE "id" = '\''%s'\''; DELETE FROM "OrderItem" WHERE "orderId" = '\''%s'\''; DELETE FROM "Order" WHERE "id" = '\''%s'\''; DELETE FROM "AuditLog" WHERE "metadata" LIKE '\''%%%s%%'\'' OR "metadata" LIKE '\''%%%s%%'\'';' "$PAYMENT_ID" "$REFUND_ID" "$REFUND_ID" "$IDEM_KEY" "$PAYMENT_ID" "$ORDER_ID" "$ORDER_ID" "$REFUND_ID" "$PAYMENT_ID")
          echo "Cleaning up..."
          supa_query "$CLEAN_SQL" > /dev/null 2>&1
          echo "✅ Cleanup complete"

          echo ""
          echo "=================================================="
          echo "  EVIDENCE SUMMARY"
          echo "=================================================="
          echo "  Run ID: $RUN_ID"
          echo "  ok: $ALL_OK"
          echo "  Step A (setup refund-full → CAPTURED Payment): $PAYMENT_DB_STATUS_A"
          echo "  Step B (refund request → REFUND_PENDING): $REFUND_STATUS_B"
          echo "  Step C (verify pending state): $STATE_C_OK"
          echo "  Step D (publisher fail → state unchanged): $STEP_D_OK"
          echo "  Step E (verify after fail — no dup): $STEP_E_OK"
          echo "  Step F (publisher retry → REFUNDED): $STEP_F_OK"
          echo "  Step G (verify final — no dup, balanced, no orphan): $STEP_G_OK"
          echo "  DB Payment final: $PAY_G_DB_STATUS"
          echo "  DB Refund final: $REF_G_DB_STATUS, gatewayRefundId=$REF_G_DB_GWID"
          echo "  DB Ledger count: $LEDGER_G_COUNT (expected 4 — NO duplicate)"
          echo "  DB AuditLog PAYMENT_REFUNDED count: $AUDIT_G_COUNT (expected 1)"
          echo "  DB Outbox status: $OUTBOX_G_STATUS (expected PUBLISHED)"
          echo "  DB Refund rows for payment: $REFUND_ROWS_G_COUNT (expected 1 — no dup)"
          echo "=================================================="

          if [ "$ALL_OK" != "true" ]; then
            echo "❌ EVIDENCE FAILED — invariant violated"
            exit 1
          fi
          echo "✅ EVIDENCE PASSED — refund failure / pending ledger semantics verified on PostgreSQL"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave5-5a-e6-postgresql-evidence
