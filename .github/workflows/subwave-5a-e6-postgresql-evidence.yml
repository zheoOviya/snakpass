# Wave-5 Sub-Wave 5a — PostgreSQL Refund Failure/Pending Ledger Semantics Evidence (E6)

name: Wave-5 5a-E6 — PostgreSQL Refund Failure / Pending Ledger Semantics

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging URL'
        required: true
        default: 'https://snakpass-eqkarf10s-snakzap.vercel.app'
      confirm:
        description: 'Type RUN-5A-E6-PG-EVIDENCE to confirm'
        required: true
        default: ''

jobs:
  postgresql-5a-e6-evidence:
    name: 5a-E6-PG — Refund failure → pending ledger → retry success on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PROJECT_REF: zmzqqcyapcezmaqvuzzd
      STAGING_URL: ${{ inputs.staging_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify trigger
        run: |
          [ "${{ github.event.inputs.confirm }}" = "RUN-5A-E6-PG-EVIDENCE" ] || { echo "❌ Wrong confirmation"; exit 1; }
          echo "✅ Authorized — Wave-5 Sub-Wave 5a-E6 PostgreSQL Refund Failure / Pending Ledger Semantics Evidence"

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Verify secrets present
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "❌ SUPABASE_ACCESS_TOKEN NOT_SET"; exit 1; }
          [ -n "$VERCEL_TOKEN" ] || { echo "❌ VERCEL_TOKEN NOT_SET"; exit 1; }
          echo "✅ All required secrets present"

      - name: Verify Refund table exists on staging (Wave-5 5a migration applied)
        run: |
          echo "=== Verifying Refund table is present on staging Supabase ==="
          VERIFY_SQL='SELECT COUNT(*) AS refund_table_exists FROM information_schema.tables WHERE table_name = '\''Refund'\'';'
          RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$VERIFY_SQL" '{query: $q}')")
          echo "$RESULT" | jq '.' 2>/dev/null || echo "$RESULT"
          COUNT=$(echo "$RESULT" | jq -r 'if type == "array" then .[0].refund_table_exists else .refund_table_exists // 0 end' 2>/dev/null)
          if [ "$COUNT" != "1" ]; then
            echo "❌ Refund table NOT present — run wave5-5a-staging-migration.yml first"
            exit 1
          fi
          echo "✅ Refund table present"

      - name: Set EVIDENCE_TEST_MODE=true on Vercel preview environment
        run: |
          set +e
          PROJECT_ID="$VERCEL_PROJECT_ID"
          API_URL="https://api.vercel.com/v10/projects/$PROJECT_ID/env"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"

          echo "  === Listing existing env vars ==="
          LIST_RESP=$(curl -sS -w "\n%{http_code}" -H "$AUTH" "$API_URL")
          LIST_HTTP=$(echo "$LIST_RESP" | tail -1)
          LIST_BODY=$(echo "$LIST_RESP" | head -n -1)
          echo "  List HTTP: $LIST_HTTP"
          if [ "$LIST_HTTP" != "200" ]; then
            echo "  ❌ Failed to list env vars (HTTP $LIST_HTTP)"
            exit 1
          fi

          # Remove existing EVIDENCE_TEST_MODE entries
          EXISTING_IDS=$(echo "$LIST_BODY" | jq -r '.envs[] | select(.key == "EVIDENCE_TEST_MODE") | .id' 2>/dev/null)
          if [ -n "$EXISTING_IDS" ]; then
            for EID in $EXISTING_IDS; do
              echo "  ⚠️  Removing existing EVIDENCE_TEST_MODE id=$EID"
              curl -sS -X DELETE -H "$AUTH" "$API_URL/$EID" > /dev/null 2>&1
            done
          fi

          # Create EVIDENCE_TEST_MODE=true for preview+production
          echo "  === Creating EVIDENCE_TEST_MODE=true ==="
          CREATE_PAYLOAD='{"key":"EVIDENCE_TEST_MODE","value":"true","target":["preview","production"],"type":"plain"}'
          RESULT=$(curl -sS -w "\n%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" "$API_URL" -d "$CREATE_PAYLOAD")
          RESULT_HTTP=$(echo "$RESULT" | tail -1)
          RESULT_BODY=$(echo "$RESULT" | head -n -1)
          echo "  Create HTTP: $RESULT_HTTP"
          if echo "$RESULT_HTTP" | grep -qE "^(200|201)$" && echo "$RESULT_BODY" | jq -e '.created.id // .id' > /dev/null 2>&1; then
            echo "  ✅ EVIDENCE_TEST_MODE=true configured"
          else
            echo "  ❌ Failed"
            exit 1
          fi

      - name: Trigger new Vercel deployment
        run: |
          set +e
          PROJECT_ID="$VERCEL_PROJECT_ID"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"

          echo "  === Querying project for linked git source info ==="
          PROJECT_RESP=$(curl -sS -w "\n%{http_code}" -H "$AUTH" "https://api.vercel.com/v9/projects/$PROJECT_ID")
          PROJECT_HTTP=$(echo "$PROJECT_RESP" | tail -1)
          PROJECT_BODY=$(echo "$PROJECT_RESP" | head -n -1)
          echo "  Project query HTTP: $PROJECT_HTTP"
          if [ "$PROJECT_HTTP" != "200" ]; then echo "❌ Failed"; exit 1; fi
          LINK_TYPE=$(echo "$PROJECT_BODY" | jq -r '.link.type // empty')
          REPO_ID=$(echo "$PROJECT_BODY" | jq -r '.link.repoId // empty')
          ORG=$(echo "$PROJECT_BODY" | jq -r '.link.org // empty')
          REPO=$(echo "$PROJECT_BODY" | jq -r '.link.repo // empty')
          echo "  Linked git source: type=$LINK_TYPE org=$ORG repo=$REPO repoId=$REPO_ID"

          echo "  === Recent READY deployments ==="
          LIST_DEPLOYS=$(curl -sS -H "$AUTH" "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&limit=5&state=READY")
          echo "$LIST_DEPLOYS" | jq -r '.deployments[]? | "    - target=\(.target // "preview") url=\(.url) created=\(.createdAt) commit=\(.meta.githubCommitSha // "n/a" | .[0:8])"' 2>/dev/null | head -5

          echo "  === Triggering PREVIEW deployment ==="
          if [ -z "$REPO_ID" ] || [ "$REPO_ID" = "null" ]; then
            echo "  ❌ Cannot trigger deployment — project has no linked repoId."
            exit 1
          fi
          PAYLOAD=$(jq -n --arg name "snakpass" --arg type "$LINK_TYPE" --arg org "$ORG" --arg repo "$REPO" --argjson repoId "$REPO_ID" --arg ref "main" '{name:$name, gitSource:{type:$type, org:$org, repo:$repo, repoId:$repoId, ref:$ref}}')
          echo "  Payload (note: no 'target' field => preview deployment):"
          echo "$PAYLOAD" | jq '.' | sed 's/^/    /'

          DEPLOY_RESP=$(curl -sS -w "\n%{http_code}" -X POST -H "$AUTH" -H "Content-Type: application/json" "https://api.vercel.com/v13/deployments" -d "$PAYLOAD")
          DEPLOY_HTTP=$(echo "$DEPLOY_RESP" | tail -1)
          DEPLOY_BODY=$(echo "$DEPLOY_RESP" | head -n -1)
          echo "  Deploy HTTP: $DEPLOY_HTTP"
          echo "  Deploy response (first 300 chars): $(echo "$DEPLOY_BODY" | head -c 300)"

          DEPLOY_ID=$(echo "$DEPLOY_BODY" | jq -r '.id // empty')
          DEPLOY_URL=$(echo "$DEPLOY_BODY" | jq -r '.url // empty')
          echo "  Deployment triggered: id=$DEPLOY_ID, url=$DEPLOY_URL"

          if [ -n "$DEPLOY_ID" ] && [ "$DEPLOY_ID" != "null" ]; then
            echo "  Waiting for deployment to be READY..."
            for i in $(seq 1 60); do
              STATUS_RESP=$(curl -sS -H "$AUTH" "https://api.vercel.com/v13/deployments/$DEPLOY_ID")
              STATUS=$(echo "$STATUS_RESP" | jq -r '.status // empty')
              READY_STATE=$(echo "$STATUS_RESP" | jq -r '.readyState // empty')
              echo "    [$i] status=$STATUS, readyState=$READY_STATE"
              if [ "$READY_STATE" = "READY" ] || [ "$STATUS" = "READY" ]; then
                echo "  ✅ Deployment is READY"
                FINAL_URL=$(echo "$STATUS_RESP" | jq -r '.url // empty')
                if [ -n "$FINAL_URL" ] && [ "$FINAL_URL" != "null" ]; then
                  NEW_STAGING_URL="https://$FINAL_URL"
                  echo "NEW_STAGING_URL=$NEW_STAGING_URL" >> $GITHUB_ENV
                fi
                break
              fi
              if [ "$READY_STATE" = "ERROR" ] || [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELED" ]; then
                echo "  ❌ Deployment $READY_STATE"
                break
              fi
              sleep 5
            done
          else
            echo "  ⚠️ Could not trigger new deployment. Using latest READY production."
          fi

      - name: Use new deployment URL if available
        run: |
          if [ -n "$NEW_STAGING_URL" ]; then
            echo "Using newly-triggered deployment URL: $NEW_STAGING_URL"
            echo "STAGING_URL=$NEW_STAGING_URL" >> $GITHUB_ENV
          else
            echo "Using provided staging URL: $STAGING_URL"
            echo "STAGING_URL=$STAGING_URL" >> $GITHUB_ENV
          fi

      - name: Verify staging health + evidence endpoints deployed
        run: |
          STAGING_URL="${STAGING_URL%/}"
          echo "=== Staging URL: $STAGING_URL ==="
          READY=0
          for attempt in $(seq 1 12); do
            echo "=== Attempt $attempt: Health check ==="
            HEALTH=$(curl -sS -w "\n%{http_code}" "$STAGING_URL/api/health")
            HEALTH_HTTP=$(echo "$HEALTH" | tail -1)
            if [ "$HEALTH_HTTP" = "200" ]; then
              echo "  === Verify evidence-setup endpoint ==="
              SETUP_RESP=$(curl -sS -w "\n%{http_code}" "$STAGING_URL/api/payments/evidence-setup?scenario=pre-flight")
              SETUP_HTTP=$(echo "$SETUP_RESP" | tail -1)
              if [ "$SETUP_HTTP" = "200" ]; then
                echo "✅ Evidence endpoints deployed + evidence test mode enabled"
                READY=1
                break
              else
                echo "  ⚠️ evidence-setup returned $SETUP_HTTP"
              fi
            else
              echo "  ⚠️ Health check failed (HTTP $HEALTH_HTTP)"
            fi
            echo "  Waiting 15s before retry..."
            sleep 15
          done
          if [ "$READY" != "1" ]; then
            echo "❌ FAILED: Staging not ready after 12 attempts."
            exit 1
          fi

      - name: Run 5a-E6 refund failure / pending ledger semantics test on PostgreSQL
        run: |
          STAGING_URL="${STAGING_URL%/}"
          RUN_ID="5a-E6-pg-$(date +%s)-$(echo $RANDOM | tr -dc 'a-z0-9' | head -c 4)"
          EVIDENCE_FILE="wave5-5a-e6-postgresql-evidence.json"

          echo "=================================================="
          echo "  Wave-5 Sub-Wave 5a-E6 — PostgreSQL Refund"
          echo "  Failure / Pending Ledger Semantics Evidence"
          echo "  Run ID: $RUN_ID"
          echo "  Staging URL: $STAGING_URL"
          echo "  Database: PostgreSQL (Supabase staging)"
          echo "  P0: P0-04 (Refund)"
          echo "=================================================="

          # Helper: query Supabase for verification
          supa_query() {
            local sql="$1"
            curl -sS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -d "$(jq -n --arg q "$sql" '{query: $q}')"
          }

          # Helper: extract scalar from Supabase response
          supa_scalar() {
            local result="$1"
            local field="$2"
            echo "$result" | jq -r "if type == \"array\" then .[0].${field} else .${field} // empty end" 2>/dev/null
          }

          # ============================
          # Step A: Setup — refund-full scenario creates a CAPTURED Payment
          # ============================
          echo ""
          echo "=== Step A: Setup — GET /api/payments/evidence-setup?scenario=refund-full ==="
          SETUP_RESP=$(curl -sS -c /tmp/cookies.txt -b /tmp/cookies.txt "$STAGING_URL/api/payments/evidence-setup?scenario=refund-full")
          echo "Setup response: $SETUP_RESP"

          ORDER_ID=$(echo "$SETUP_RESP" | jq -r '.orderId')
          PAYMENT_ID=$(echo "$SETUP_RESP" | jq -r '.paymentId')
          SESSION_TOKEN=$(echo "$SETUP_RESP" | jq -r '.sessionToken')
          CSRF_TOKEN=$(echo "$SETUP_RESP" | jq -r '.csrfToken')
          PAYMENT_AMOUNT=$(echo "$SETUP_RESP" | jq -r '.paymentAmount // empty')

          if [ -z "$PAYMENT_ID" ] || [ "$PAYMENT_ID" = "null" ]; then
            echo "❌ Failed to create test payment via refund-full scenario"
            exit 1
          fi
          echo "✅ Setup created: orderId=$ORDER_ID, paymentId=$PAYMENT_ID (CAPTURED), amount=$PAYMENT_AMOUNT"

          # Verify Payment is CAPTURED via PostgreSQL
          PAYMENT_CHECK=$(supa_query "SELECT \"status\", \"amount\" FROM \"Payment\" WHERE \"id\" = '$PAYMENT_ID';")
          echo "PostgreSQL Payment row: $PAYMENT_CHECK"
          PAYMENT_DB_STATUS_A=$(supa_scalar "$PAYMENT_CHECK" "status")
          echo "  Payment status (DB): $PAYMENT_DB_STATUS_A (expected: CAPTURED)"

          # ============================
          # Step B: Request refund (creates REFUND_PENDING + ledger reversal entries)
          # ============================
          echo ""
          echo "=== Step B: POST /api/payments/refund with Idempotency-Key ==="
          IDEM_KEY="ev-5a-E6-pg-$(date +%s)-$(echo $RANDOM | tr -dc 'a-z0-9' | head -c 6)"
          REFUND_RESP=$(curl -sS -w "\n%{http_code}" -X POST "$STAGING_URL/api/payments/refund" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: $IDEM_KEY" \
            -H "Cookie: snakzap_session=$SESSION_TOKEN; snakzap_csrf=$CSRF_TOKEN" \
            -H "X-CSRF-Token: $CSRF_TOKEN" \
            -d "{\"paymentId\":\"$PAYMENT_ID\"}")
          REFUND_HTTP=$(echo "$REFUND_RESP" | tail -1)
          REFUND_BODY=$(echo "$REFUND_RESP" | head -n -1)
          echo "Refund HTTP: $REFUND_HTTP"
          echo "Refund body: $(echo "$REFUND_BODY" | head -c 400)"

          REFUND_ID=$(echo "$REFUND_BODY" | jq -r '.refund.id // empty')
          REFUND_STATUS_B=$(echo "$REFUND_BODY" | jq -r '.refund.status // empty')
          echo "  Refund id: $REFUND_ID"
          echo "  Refund status: $REFUND_STATUS_B (expected: REFUND_PENDING)"

          if [ -z "$REFUND_ID" ] || [ "$REFUND_ID" = "null" ] || [ "$REFUND_STATUS_B" != "REFUND_PENDING" ]; then
            echo "❌ Step B failed: refund not in REFUND_PENDING state"
            exit 1
          fi
          echo "✅ Step B: Refund $REFUND_ID created in REFUND_PENDING state"

          # ============================
          # Step C: Verify state — Payment=CAPTURED, Ledger=4, balanced
          # ============================
          echo ""
          echo "=== Step C: Verify state after refund request (via evidence-verify) ==="
          VERIFY_C=$(curl -sS "$STAGING_URL/api/payments/evidence-verify?orderId=$ORDER_ID&idempotencyKey=$IDEM_KEY&refundId=$REFUND_ID&refundIdempotencyKey=$IDEM_KEY")
          echo "Verify C: $(echo "$VERIFY_C" | jq -c '. | {paymentStatus: .payment.status, ledgerEntries, ledgerDrCount, ledgerCrCount, ledgerDrSum, ledgerCrSum, ledgerBalanceIntact, refund: .refund.status, reversalDrCount, reversalCrCount}')"

          STATE_C_PAYMENT=$(echo "$VERIFY_C" | jq -r '.payment.status')
          STATE_C_LEDGER_ENTRIES=$(echo "$VERIFY_C" | jq -r '.ledgerEntries')
          STATE_C_LEDGER_DR_COUNT=$(echo "$VERIFY_C" | jq -r '.ledgerDrCount')
          STATE_C_LEDGER_CR_COUNT=$(echo "$VERIFY_C" | jq -r '.ledgerCrCount')
          STATE_C_LEDGER_DR_SUM=$(echo "$VERIFY_C" | jq -r '.ledgerDrSum')
          STATE_C_LEDGER_CR_SUM=$(echo "$VERIFY_C" | jq -r '.ledgerCrSum')
          STATE_C_BALANCE_INTACT=$(echo "$VERIFY_C" | jq -r '.ledgerBalanceIntact')
          STATE_C_REFUND_STATUS=$(echo "$VERIFY_C" | jq -r '.refund.status')
          STATE_C_REVERSAL_DR=$(echo "$VERIFY_C" | jq -r '.reversalDrCount')
          STATE_C_REVERSAL_CR=$(echo "$VERIFY_C" | jq -r '.reversalCrCount')

          echo "  Payment status: $STATE_C_PAYMENT (expected: CAPTURED — unchanged)"
          echo "  Ledger entries: $STATE_C_LEDGER_ENTRIES (expected: 4 — 2 capture + 2 refund reversal)"
          echo "  Ledger Dr count: $STATE_C_LEDGER_DR_COUNT, Cr count: $STATE_C_LEDGER_CR_COUNT (expected: 2/2)"
          echo "  Ledger Dr sum: $STATE_C_LEDGER_DR_SUM, Cr sum: $STATE_C_LEDGER_CR_SUM (expected: equal)"
          echo "  Ledger balance intact: $STATE_C_BALANCE_INTACT (expected: true)"
          echo "  Refund status: $STATE_C_REFUND_STATUS (expected: REFUND_PENDING)"
          echo "  Reversal Dr count: $STATE_C_REVERSAL_DR, Cr count: $STATE_C_REVERSAL_CR (expected: 1/1)"

          STATE_C_OK="false"
          if [ "$STATE_C_PAYMENT" = "CAPTURED" ] && \
             [ "$STATE_C_LEDGER_ENTRIES" = "4" ] && \
             [ "$STATE_C_LEDGER_DR_COUNT" = "2" ] && \
             [ "$STATE_C_LEDGER_CR_COUNT" = "2" ] && \
             [ "$STATE_C_LEDGER_DR_SUM" = "$STATE_C_LEDGER_CR_SUM" ] && \
             [ "$STATE_C_LEDGER_DR_SUM" != "0" ] && \
             [ "$STATE_C_BALANCE_INTACT" = "true" ] && \
             [ "$STATE_C_REFUND_STATUS" = "REFUND_PENDING" ] && \
             [ "$STATE_C_REVERSAL_DR" = "1" ] && \
             [ "$STATE_C_REVERSAL_CR" = "1" ]; then
            STATE_C_OK="true"
            echo "✅ Step C PASS: Payment CAPTURED, Ledger=4 balanced, Refund=REFUND_PENDING"
          else
            echo "❌ Step C FAIL: state mismatch after refund request"
          fi

          # Cross-check via PostgreSQL direct queries
          echo "  --- Cross-checking via Supabase Management API (direct SQL) ---"
          PAY_C_ROW=$(supa_query "SELECT \"status\" FROM \"Payment\" WHERE \"id\" = '$PAYMENT_ID';")
          PAY_C_DB_STATUS=$(supa_scalar "$PAY_C_ROW" "status")
          REF_C_ROW=$(supa_query "SELECT \"status\" FROM \"Refund\" WHERE \"id\" = '$REFUND_ID';")
          REF_C_DB_STATUS=$(supa_scalar "$REF_C_ROW" "status")
          LEDGER_C_ROW=$(supa_query "SELECT COUNT(*) AS cnt, (SELECT COALESCE(SUM(amount),0) FROM \"LedgerEntry\" WHERE \"paymentId\"='$PAYMENT_ID' AND \"entryType\"='DEBIT') AS dr_sum, (SELECT COALESCE(SUM(amount),0) FROM \"LedgerEntry\" WHERE \"paymentId\"='$PAYMENT_ID' AND \"entryType\"='CREDIT') AS cr_sum FROM \"LedgerEntry\" WHERE \"paymentId\" = '$PAYMENT_ID';")
          LEDGER_C_COUNT=$(supa_scalar "$LEDGER_C_ROW" "cnt")
          LEDGER_C_DR_SUM=$(supa_scalar "$LEDGER_C_ROW" "dr_sum")
          LEDGER_C_CR_SUM=$(supa_scalar "$LEDGER_C_ROW" "cr_sum")
          echo "  DB Payment: $PAY_C_DB_STATUS (expected CAPTURED)"
          echo "  DB Refund: $REF_C_DB_STATUS (expected REFUND_PENDING)"
          echo "  DB Ledger count: $LEDGER_C_COUNT (expected 4), Dr=$LEDGER_C_DR_SUM, Cr=$LEDGER_C_CR_SUM"

          # ============================
          # Step D: Publisher fail (simulateFail=true)
          # ============================
          echo ""
          echo "=== Step D: POST /api/payments/evidence-publisher-run?refundId=X&mode=refund&simulateFail=true ==="
          PUB_FAIL_RESP=$(curl -sS -w "\n%{http_code}" -X POST "$STAGING_URL/api/payments/evidence-publisher-run?refundId=$REFUND_ID&mode=refund&simulateFail=true")
          PUB_FAIL_HTTP=$(echo "$PUB_FAIL_RESP" | tail -1)
          PUB_FAIL_BODY=$(echo "$PUB_FAIL_RESP" | head -n -1)
          echo "Publisher fail HTTP: $PUB_FAIL_HTTP"
          echo "Publisher fail body: $PUB_FAIL_BODY"

          PUB_FAIL_REFUND_CALLED=$(echo "$PUB_FAIL_BODY" | jq -r '.refundCalled // false')
          PUB_FAIL_ERROR=$(echo "$PUB_FAIL_BODY" | jq -r '.error // empty')
          PUB_FAIL_STATUS_AFTER=$(echo "$PUB_FAIL_BODY" | jq -r '.statusAfter // empty')
          PUB_FAIL_PAYMENT_AFTER=$(echo "$PUB_FAIL_BODY" | jq -r '.paymentStatusAfter // empty')
          echo "  refundCalled: $PUB_FAIL_REFUND_CALLED (expected: true)"
          echo "  error: $PUB_FAIL_ERROR (expected: contains SIMULATED_FAILURE)"
          echo "  statusAfter (Refund): $PUB_FAIL_STATUS_AFTER (expected: REFUND_PENDING — unchanged)"
          echo "  paymentStatusAfter: $PUB_FAIL_PAYMENT_AFTER (expected: CAPTURED — unchanged)"

          STEP_D_OK="false"
          if [ "$PUB_FAIL_REFUND_CALLED" = "true" ] && \
             echo "$PUB_FAIL_ERROR" | grep -q "SIMULATED_FAILURE" && \
             [ "$PUB_FAIL_STATUS_AFTER" = "REFUND_PENDING" ] && \
             [ "$PUB_FAIL_PAYMENT_AFTER" = "CAPTURED" ]; then
            STEP_D_OK="true"
            echo "✅ Step D PASS: publisher simulated failure, state unchanged"
          else
            echo "❌ Step D FAIL: publisher fail semantics incorrect"
          fi

          # ============================
          # Step E: Verify state after fail — Payment=CAPTURED, Ledger=4 (no dup), balanced
          # ============================
          echo ""
          echo "=== Step E: Verify state after failed publisher run ==="
          VERIFY_E=$(curl -sS "$STAGING_URL/api/payments/evidence-verify?orderId=$ORDER_ID&idempotencyKey=$IDEM_KEY&refundId=$REFUND_ID&refundIdempotencyKey=$IDEM_KEY")
          echo "Verify E: $(echo "$VERIFY_E" | jq -c '. | {paymentStatus: .payment.status, ledgerEntries, ledgerDrCount, ledgerCrCount, ledgerBalanceIntact, refund: .refund.status, reversalDrCount, reversalCrCount}')"

          STATE_E_PAYMENT=$(echo "$VERIFY_E" | jq -r '.payment.status')
          STATE_E_LEDGER_ENTRIES=$(echo "$VERIFY_E" | jq -r '.ledgerEntries')
          STATE_E_LEDGER_DR_SUM=$(echo "$VERIFY_E" | jq -r '.ledgerDrSum')
          STATE_E_LEDGER_CR_SUM=$(echo "$VERIFY_E" | jq -r '.ledgerCrSum')
          STATE_E_BALANCE_INTACT=$(echo "$VERIFY_E" | jq -r '.ledgerBalanceIntact')
          STATE_E_REFUND_STATUS=$(echo "$VERIFY_E" | jq -r '.refund.status')
          STATE_E_REVERSAL_DR=$(echo "$VERIFY_E" | jq -r '.reversalDrCount')
          STATE_E_REVERSAL_CR=$(echo "$VERIFY_E" | jq -r '.reversalCrCount')

          echo "  Payment status: $STATE_E_PAYMENT (expected: CAPTURED — unchanged)"
          echo "  Ledger entries: $STATE_E_LEDGER_ENTRIES (expected: 4 — no duplicate)"
          echo "  Ledger Dr sum: $STATE_E_LEDGER_DR_SUM, Cr sum: $STATE_E_LEDGER_CR_SUM (expected: equal)"
          echo "  Ledger balance intact: $STATE_E_BALANCE_INTACT (expected: true)"
          echo "  Refund status: $STATE_E_REFUND_STATUS (expected: REFUND_PENDING — unchanged)"
          echo "  Reversal Dr count: $STATE_E_REVERSAL_DR, Cr count: $STATE_E_REVERSAL_CR (expected: 1/1 — no dup)"

          STEP_E_OK="false"
          if [ "$STATE_E_PAYMENT" = "CAPTURED" ] && \
             [ "$STATE_E_LEDGER_ENTRIES" = "4" ] && \
             [ "$STATE_E_LEDGER_DR_SUM" = "$STATE_E_LEDGER_CR_SUM" ] && \
             [ "$STATE_E_LEDGER_DR_SUM" != "0" ] && \
             [ "$STATE_E_BALANCE_INTACT" = "true" ] && \
             [ "$STATE_E_REFUND_STATUS" = "REFUND_PENDING" ] && \
             [ "$STATE_E_REVERSAL_DR" = "1" ] && \
