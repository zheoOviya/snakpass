# Wave-5 Sub-Wave 5b — Apply Staging Migration (ReconciliationRun + ReconciliationFinding tables)
# Adds the Class-2 additive reconciliation tables (P0-03 detection-only)

name: Wave-5 5b — Apply Staging Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-WAVE5-5B to confirm'
        required: true
        default: ''

jobs:
  migrate:
    name: Apply Wave-5 5b schema migration to staging Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zmzqqcyapcezmaqvuzzd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify trigger
        run: |
          [ "${{ github.event.inputs.confirm }}" = "APPLY-WAVE5-5B" ] || { echo "❌ Wrong confirmation"; exit 1; }
          echo "✅ Authorized — Wave-5 Sub-Wave 5b staging migration (P0-03 Reconciliation tables)"

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Verify secrets present
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "❌ SUPABASE_ACCESS_TOKEN NOT_SET"; exit 1; }
          echo "✅ Secrets present"

      - name: Apply migration via Supabase Management API
        run: |
          echo "=== Applying Wave-5 5b migration to staging Supabase ==="
          RESULT=$(jq -n --rawfile sql prisma/scripts/wave5-subwave-5b-migration.sql '{query: $sql}' | \
            curl -sS -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -d @-)
          echo "$RESULT"
          echo "=== Migration complete ==="

      - name: Verify schema (ReconciliationRun + ReconciliationFinding tables exist)
        run: |
          echo "=== Verifying reconciliation tables ==="
          VERIFY_SQL='SELECT (SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '\''ReconciliationRun'\'') AS run_table, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''ReconciliationRun'\'' AND column_name = '\''triggerType'\'') AS run_triggertype, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''ReconciliationRun'\'' AND column_name = '\''mismatchCount'\'') AS run_mismatchcount, (SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '\''ReconciliationFinding'\'') AS finding_table, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''ReconciliationFinding'\'' AND column_name = '\''mismatchClass'\'') AS finding_mismatchclass, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''ReconciliationFinding'\'' AND column_name = '\''exceptionId'\'') AS finding_exceptionid, (SELECT COUNT(*) FROM pg_indexes WHERE indexname = '\''ReconciliationFinding_mismatchClass_entityId_resolvedAt_key'\'') AS finding_unique_idx;'
          RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$VERIFY_SQL" '{query: $q}')")
          echo "$RESULT" | jq '.' 2>/dev/null || echo "$RESULT"
          echo "=== Verification complete ==="
