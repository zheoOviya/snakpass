# =============================================================================
# Wave-1 Sub-Wave 1a — Apply Schema Migration to Staging Supabase
# -----------------------------------------------------------------------------
# Applies the Class-2 (expand-migrate-contract, ADDITIVE ONLY) migration:
#   - P0-25: version fields on Order, KillSwitch, MenuItem (+ availableCount)
#   - P0-17: IdempotencyKey table
#
# Uses the Supabase Management API (HTTPS/IPv4) — same pattern as
# dev-001-sql-execution.yml — to bypass the IPv6 limitation of direct DB
# connections.
#
# Scope: STAGING ONLY (shared staging+prod Supabase project zmzqqcyapcezmaqvuzzd).
# Does NOT touch production env vars, production Vercel, or production deployment.
# =============================================================================

name: Wave-1 1a — Apply Staging Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-WAVE1-1A to confirm'
        required: true
        default: ''

jobs:
  migrate:
    name: Apply Wave-1 1a schema migration to staging Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zmzqqcyapcezmaqvuzzd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify trigger
        run: |
          [ "${{ github.event.inputs.confirm }}" = "APPLY-WAVE1-1A" ] || { echo "❌ Wrong confirmation"; exit 1; }
          echo "✅ Authorized — Wave-1 Sub-Wave 1a staging migration"

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Verify secrets present
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "❌ SUPABASE_ACCESS_TOKEN NOT_SET"; exit 1; }
          echo "✅ Secrets present"

      - name: Apply migration via Supabase Management API
        run: |
          echo "=== Applying Wave-1 1a migration to staging Supabase ==="
          # Use jq -R @csv to safely read the SQL file into a JSON string
          # (avoids shell escaping issues with $$, (), '', etc. in the SQL)
          RESULT=$(jq -n --rawfile sql prisma/scripts/wave1-subwave-1a-migration.sql '{query: $sql}' | \
            curl -sS -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -d @-)
          echo "$RESULT"
          echo "=== Migration complete ==="

      - name: Verify schema (column existence)
        run: |
          echo "=== Verifying schema changes ==="
          VERIFY_SQL='
          SELECT
            (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''MenuItem'\'' AND column_name IN ('\''availableCount'\'', '\''version'\'')) AS menuitem_new_cols,
            (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''Order'\'' AND column_name = '\''version'\'') AS order_version_col,
            (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''KillSwitch'\'' AND column_name = '\''version'\'') AS killswitch_version_col,
            (SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '\''IdempotencyKey'\'') AS idempotencykey_table;
          '
          RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$VERIFY_SQL" '{query: $q}')")
          echo "$RESULT" | jq '.' 2>/dev/null || echo "$RESULT"
          echo "=== Verification complete ==="

      - name: Summary
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "  WAVE-1 SUB-WAVE 1a — STAGING MIGRATION COMPLETE"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "Supabase project: $PROJECT_REF (staging)"
          echo "Migration: prisma/scripts/wave1-subwave-1a-migration.sql"
          echo ""
          echo "Changes applied:"
          echo "  - MenuItem: + availableCount (nullable), + version (default 0)"
          echo "  - Order: + version (default 0)"
          echo "  - KillSwitch: + version (default 0)"
          echo "  - IdempotencyKey: new table (key unique, resourceType+resourceId indexed)"
          echo ""
          echo "  Production: NOT TOUCHED (staging-only migration)"
          echo "═══════════════════════════════════════════════════════════════"
