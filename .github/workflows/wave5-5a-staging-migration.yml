# Wave-5 Sub-Wave 5a — Apply Staging Migration (Refund table)
# Adds the Refund table + Payment.refunds 1:N relation (Class-2 ADDITIVE)

name: Wave-5 5a — Apply Staging Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-WAVE5-5A to confirm'
        required: true
        default: ''

jobs:
  migrate:
    name: Apply Wave-5 5a schema migration to staging Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zmzqqcyapcezmaqvuzzd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify trigger
        run: |
          [ "${{ github.event.inputs.confirm }}" = "APPLY-WAVE5-5A" ] || { echo "❌ Wrong confirmation"; exit 1; }
          echo "✅ Authorized — Wave-5 Sub-Wave 5a staging migration (P0-04 Refund table)"

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Verify secrets present
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "❌ SUPABASE_ACCESS_TOKEN NOT_SET"; exit 1; }
          echo "✅ Secrets present"

      - name: Apply migration via Supabase Management API
        run: |
          echo "=== Applying Wave-5 5a migration to staging Supabase ==="
          RESULT=$(jq -n --rawfile sql prisma/scripts/wave5-subwave-5a-migration.sql '{query: $sql}' | \
            curl -sS -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -d @-)
          echo "$RESULT"
          echo "=== Migration complete ==="

      - name: Verify schema (Refund table exists with expected columns + indexes)
        run: |
          echo "=== Verifying Refund table ==="
          VERIFY_SQL='SELECT (SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '\''Refund'\'') AS refund_table, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''Refund'\'' AND column_name = '\''paymentId'\'') AS refund_paymentid, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''Refund'\'' AND column_name = '\''status'\'') AS refund_status, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''Refund'\'' AND column_name = '\''idempotencyKey'\'') AS refund_idempotencykey, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''Refund'\'' AND column_name = '\''gatewayRefundId'\'') AS refund_gatewayrefundid, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''Refund'\'' AND column_name = '\''refundedAt'\'') AS refund_refundedat, (SELECT COUNT(*) FROM pg_indexes WHERE indexname = '\''Refund_idempotencyKey_key'\'') AS refund_idem_unique_idx, (SELECT COUNT(*) FROM pg_indexes WHERE indexname = '\''Refund_paymentId_status_idx'\'') AS refund_paymentid_status_idx, (SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_name = '\''Refund_paymentId_fkey'\'') AS refund_paymentid_fkey;'
          RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$VERIFY_SQL" '{query: $q}')")
          echo "$RESULT" | jq '.' 2>/dev/null || echo "$RESULT"
          echo "=== Verification complete ==="
