# =============================================================================
# P0-27 — SnakZap Continuous Deployment (Vercel)
# -----------------------------------------------------------------------------
# Triggers AFTER CI passes on `main`. Two environment-gated targets:
#
#   staging      — auto-deployed on every merge to main (no approval)
#   production   — promotion requires manual approval (GitHub environment
#                  review on the `production` environment)
#
# Staging runs smoke tests against the freshly deployed URL. If any smoke test
# fails, the production deployment job is skipped (failing-gate semantics).
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN         — Vercel personal access token
#   VERCEL_ORG_ID        — Vercel team/user ID
#   VERCEL_PROJECT_ID     — Vercel project ID (per-project)
#
# Required GitHub Environments (Settings → Environments):
#   staging      — no protection rules (auto-deploy)
#   production   — "Required reviewers" enabled (manual approval gate)
#
# This workflow DOES NOT deploy the mini-services — they are out-of-scope for
# Vercel (long-lived processes). See P0-27-PHASE2-REMEDIATION.md §7 for the
# mini-service deployment plan (Fly.io / Railway / Render).
# =============================================================================

name: Deploy (Vercel — staging + production)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target: staging | production | staging-and-production'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - staging-and-production

# Only one CD run per ref — newer pushes cancel older in-flight deploys.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write    # to create Vercel-style deployment records
  actions: read         # to query the CI workflow status

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — confirm CI passed on the same SHA
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI must pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve SHA
        id: sha
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Verify CI workflow success on ${{ github.sha }}
        id: check_ci
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              status: 'completed',
              per_page: 5,
            });
            const ok = runs.workflow_runs.some(
              (r) => r.conclusion === 'success'
            );
            if (!ok) {
              core.setFailed(`No successful CI run found for SHA ${context.sha}. CD blocked.`);
              return;
            }
            core.info(`CI passed on ${context.sha}. Continuing to staging.`);

  # ---------------------------------------------------------------------------
  # Staging deploy (auto)
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy → staging
    needs: ci-gate
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 10
    outputs:
      staging_url: ${{ steps.deploy.outputs.url }}
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
      meta_sha: ${{ needs.ci-gate.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull Vercel project config (staging env)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          echo "orgId=\"$VERCEL_ORG_ID\"" > .vercel/project.local
          echo "projectId=\"$VERCEL_PROJECT_ID\"" >> .vercel/project.local
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build (next build, Node runtime — see P0-27 §9 Vercel/Bun note)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy to staging (Vercel preview)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          DEPLOY_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" \
            --meta sha="${{ needs.ci-gate.outputs.sha }}" \
            --meta actor="${{ github.actor }}" \
            --meta pipeline=p0-27-cd \
            --meta stage=staging)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          # Vercel returns the deployment URL; capture last segment as deployment_id
          DEPLOY_ID=$(basename "$DEPLOY_URL")
          echo "deployment_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Staging deployment complete: $DEPLOY_URL (id=$DEPLOY_ID)"

      - name: Run smoke tests against staging
        id: smoke
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/smoke-test.sh
          ./scripts/smoke-test.sh "$BASE_URL" > smoke-results.json
          echo "===== Smoke test summary ====="
          cat smoke-results.json

          # Fail if overall ok=false
          if ! jq -e '.ok == true' smoke-results.json > /dev/null; then
            echo "::error::Smoke tests failed against $BASE_URL"
            exit 1
          fi
          echo "Smoke tests PASSED against $BASE_URL"

      - name: Upload smoke-test evidence (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-${{ needs.ci-gate.outputs.sha }}
          path: |
            smoke-results.json
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Deployment record (staging)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const res = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ needs.ci-gate.outputs.sha }}',
              environment: 'staging',
              required_contexts: [],
              production_environment: false,
              auto_merge: false,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: res.data.id,
              state: 'success',
              environment_url: url,
              description: 'Vercel preview deploy',
            });
            core.info(`Staging deployment recorded: ${url}`);

  # ---------------------------------------------------------------------------
  # Production deploy (manual approval via environment.reviewers)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy → production (manual approval)
    needs: [ci-gate, deploy-staging]
    # Skip production for manual "staging-only" runs.
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'production' || github.event.inputs.target == 'staging-and-production' }}
    runs-on: ubuntu-latest
    environment:
      # GitHub requires approval before any job that targets `production` runs.
      name: production
      url: ${{ steps.promote.outputs.url }}
    timeout-minutes: 15
    outputs:
      production_url: ${{ steps.promote.outputs.url }}
      promotion_id: ${{ steps.promote.outputs.promotion_id }}
      rollback_target: ${{ steps.promote.outputs.promotion_id }}
    steps:
      - name: Verify staging smoke tests passed
        run: |
          echo "Staging deploy conclusion: ${{ needs.deploy-staging.result }}"
          if [ "${{ needs.deploy-staging.result }}" != "success" ]; then
            echo "::error::Staging deploy did not succeed — refusing to promote to production."
            exit 1
          fi
          echo "Staging verified OK. Proceeding to promote."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Promote staging deployment to production
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # `vercel promote` aliased a preview deployment to production domain.
          STAGING_URL="${{ needs.deploy-staging.outputs.staging_url }}"
          echo "Promoting $STAGING_URL → production..."
          vercel promote "$STAGING_URL" --token="$VERCEL_TOKEN" --yes
          # The production URL is the project's production domain alias.
          PROD_URL=$(vercel ls --token="$VERCEL_TOKEN" --yes \
            | awk '/Ready/ {print $1}' | head -n1)
          echo "url=$PROD_URL" >> "$GITHUB_OUTPUT"
          echo "promotion_id=$(basename "$STAGING_URL")" >> "$GITHUB_OUTPUT"
          echo "Production promotion complete: $PROD_URL"

      - name: Verify production health (post-promotion smoke)
        env:
          BASE_URL: ${{ steps.promote.outputs.url }}
        run: |
          set -euo pipefail
          # Allow DNS + edge propagation before probing.
          sleep 20
          chmod +x ./scripts/smoke-test.sh
          ./scripts/smoke-test.sh "$BASE_URL" > prod-smoke-results.json
          echo "===== Production smoke test summary ====="
          cat prod-smoke-results.json
          if ! jq -e '.ok == true' prod-smoke-results.json > /dev/null; then
            echo "::error::Production smoke tests failed. ROLLBACK REQUIRED."
            exit 1
          fi

      - name: Upload production smoke evidence (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ needs.ci-gate.outputs.sha }}
          path: |
            prod-smoke-results.json
          retention-days: 90
          if-no-files-found: warn

      - name: Create GitHub Deployment record (production)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.promote.outputs.url }}';
            const res = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ needs.ci-gate.outputs.sha }}',
              environment: 'production',
              required_contexts: [],
              production_environment: true,
              auto_merge: false,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: res.data.id,
              state: 'success',
              environment_url: url,
              description: 'Vercel production deploy (P0-27 CD)',
            });
            core.notice(`Production deployment live at ${url}`);

  # ---------------------------------------------------------------------------
  # Final summary — emits the canonical deployment URL for evidence collection.
  # ---------------------------------------------------------------------------
  evidence:
    name: Capture deployment evidence
    needs: [ci-gate, deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Emit evidence summary
        env:
          SHA: ${{ needs.ci-gate.outputs.sha }}
          STAGING_URL: ${{ needs.deploy-staging.outputs.staging_url }}
          PRODUCTION_URL: ${{ needs.deploy-production.outputs.production_url }}
          STAGING_RESULT: ${{ needs.deploy-staging.result }}
          PRODUCTION_RESULT: ${{ needs.deploy-production.result }}
        run: |
          mkdir -p evidence
          cat > evidence/deployment-evidence.json <<JSON
          {
            "task": "P0-27 CD",
            "sha": "${SHA}",
            "actor": "${{ github.actor }}",
            "trigger": "${{ github.event_name }}",
            "staging": {
              "url": "${STAGING_URL}",
              "result": "${STAGING_RESULT}"
            },
            "production": {
              "url": "${PRODUCTION_URL}",
              "result": "${PRODUCTION_RESULT}"
            },
            "captured_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          echo "===== P0-27 deployment evidence ====="
          cat evidence/deployment-evidence.json

      - name: Upload deployment evidence (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ needs.ci-gate.outputs.sha }}
          path: evidence/
          retention-days: 90
