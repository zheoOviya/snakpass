# P0-27 / DEV-001 — Production WORM Closure Workflow
#
# This workflow provisions a managed PostgreSQL instance via Supabase,
# migrates the existing SQLite schema to PostgreSQL, creates role-separated
# privileges (snakzap_admin + snakzap_app), executes REVOKE UPDATE/DELETE
# on the audit_log table, then runs positive + negative tamper tests.
#
# Required GitHub Secrets (configure in repo Settings → Secrets → Actions):
#   - SUPABASE_ACCESS_TOKEN   (Supabase dashboard → Account → Access Tokens)
#   - SUPABASE_ORG_ID          (Supabase dashboard → Account → Organizations → ID)
#   - SNAKZAP_PROJECT_NAME     (e.g. "snakzap-prod")
#   - SNAKZAP_REGION           (e.g. "ap-south-1")
#
# Optional:
#   - VERCEL_TOKEN             (for follow-on P0-27 Phase 2 deployment)
#   - VERCEL_TEAM_ID           (only for Vercel team accounts)
#
# NO credentials are exposed in logs. All sensitive values come from secrets.
# Evidence is captured as a workflow artifact (evidence.json) and printed to logs.

name: DEV-001 Closure

on:
  workflow_dispatch:  # manual trigger only — no automatic runs
    inputs:
      confirm_production:
        description: 'Type "PROD-WORM-CLOSURE" to confirm production WORM closure execution'
        required: true
        default: ''

# Cancel in-progress runs for the same ref
concurrency:
  group: dev-001-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-trigger:
    name: Verify Manual Trigger Confirmation
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" = "PROD-WORM-CLOSURE" ]; then
            echo "authorized=true" >> $GITHUB_OUTPUT
            echo "✅ Production WORM closure authorized"
          else
            echo "authorized=false" >> $GITHUB_OUTPUT
            echo "❌ Confirmation string mismatch. Workflow will not proceed."
            exit 1
          fi

  provision-postgresql:
    name: Provision Supabase PostgreSQL
    needs: verify-trigger
    if: needs.verify-trigger.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      database_url: ${{ steps.provision.outputs.database_url }}
      project_ref: ${{ steps.provision.outputs.project_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets present (no value exposure)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORG_ID: ${{ secrets.SUPABASE_ORG_ID }}
          SNAKZAP_PROJECT_NAME: ${{ secrets.SNAKZAP_PROJECT_NAME }}
          SNAKZAP_REGION: ${{ secrets.SNAKZAP_REGION }}
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "❌ SUPABASE_ACCESS_TOKEN missing"; exit 1; }
          [ -n "$SUPABASE_ORG_ID" ] || { echo "❌ SUPABASE_ORG_ID missing"; exit 1; }
          [ -n "$SNAKZAP_PROJECT_NAME" ] || { echo "❌ SNAKZAP_PROJECT_NAME missing"; exit 1; }
          [ -n "$SNAKZAP_REGION" ] || { echo "❌ SNAKZAP_REGION missing"; exit 1; }
          echo "✅ All required secrets present (values not exposed)"

      - name: Provision Supabase project via Management API
        id: provision
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORG_ID: ${{ secrets.SUPABASE_ORG_ID }}
          SNAKZAP_PROJECT_NAME: ${{ secrets.SNAKZAP_PROJECT_NAME }}
          SNAKZAP_REGION: ${{ secrets.SNAKZAP_REGION }}
        run: |
          set -euo pipefail
          echo "Provisioning Supabase project: $SNAKZAP_PROJECT_NAME in $SNAKZAP_REGION"
          echo "Note: jq is pre-installed on ubuntu-latest runners (no apt install needed)."

          # Generate a secure random DB password up front (used for both new + existing projects).
          # Only alphanumerics so it stays URL-safe for the postgresql:// connection string.
          SECURE_PASSWORD=$(openssl rand -base64 32 | tr -d '/+=' | head -c 32)
          # Mask the password in all subsequent log output for this run.
          echo "::add-mask::$SECURE_PASSWORD"

          # ----------------------------------------------------------
          # Step 1: Validate access token + list existing projects.
          # Capture HTTP status separately from body so we can give a
          # clear, actionable error if the token is invalid/expired.
          # ----------------------------------------------------------
          echo "--- GET /v1/projects (validate token + list projects) ---"
          LIST_HTTP=$(curl -sS -o /tmp/sb_projects.json -w "%{http_code}" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects" || echo "000")
          echo "GET /v1/projects -> HTTP $LIST_HTTP"

          if [ "$LIST_HTTP" != "200" ]; then
            echo "❌ Supabase API rejected the access token (HTTP $LIST_HTTP)."
            echo "   Response body:"
            cat /tmp/sb_projects.json || true
            echo ""
            echo "   Likely causes:"
            echo "     1. SUPABASE_ACCESS_TOKEN is expired or revoked."
            echo "        Generate a fresh one at https://supabase.com/dashboard/account/tokens"
            echo "     2. SUPABASE_ACCESS_TOKEN was pasted with leading/trailing whitespace."
            echo "        Re-set the secret with no surrounding spaces."
            exit 1
          fi

          # ----------------------------------------------------------
          # Step 1.5: Resolve the org ID to a valid UUID.
          # The user might have provided a slug (e.g. "my-org") instead
          # of the UUID. We GET /v1/organizations and find the matching
          # org (by id OR slug), then use its canonical id for the
          # create-project call.
          # ----------------------------------------------------------
          echo "--- GET /v1/organizations (resolve org UUID) ---"
          ORG_HTTP=$(curl -sS -o /tmp/sb_orgs.json -w "%{http_code}" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/organizations" || echo "000")
          echo "GET /v1/organizations -> HTTP $ORG_HTTP"

          if [ "$ORG_HTTP" != "200" ]; then
            echo "❌ Could not list organizations (HTTP $ORG_HTTP)."
            cat /tmp/sb_orgs.json || true
            exit 1
          fi

          # Try to match by id (exact match) OR by name/slug (case-insensitive).
          RESOLVED_ORG_ID=$(jq -r --arg provided "$SUPABASE_ORG_ID" '
            .[] | select(.id == $provided or (.name | ascii_downcase) == ($provided | ascii_downcase) or (.slug | ascii_downcase) == ($provided | ascii_downcase)) | .id
          ' /tmp/sb_orgs.json 2>/dev/null | head -1)

          if [ -z "$RESOLVED_ORG_ID" ] || [ "$RESOLVED_ORG_ID" = "null" ]; then
            echo "❌ Could not find an organization matching SUPABASE_ORG_ID='$SUPABASE_ORG_ID'"
            echo "   Available organizations (id | name | slug):"
            jq -r '.[] | "     - id=\(.id) name=\(.name) slug=\(.slug // \"n/a\")"' /tmp/sb_orgs.json 2>/dev/null || cat /tmp/sb_orgs.json
            echo ""
            echo "   Fix: Update the SUPABASE_ORG_ID GitHub secret with one of the id values above."
            exit 1
          fi

          if [ "$RESOLVED_ORG_ID" != "$SUPABASE_ORG_ID" ]; then
            echo "ℹ️  Resolved org: provided='$SUPABASE_ORG_ID' → canonical UUID='$RESOLVED_ORG_ID'"
          else
            echo "✅ Org ID verified: $RESOLVED_ORG_ID"
          fi
          ORG_ID_TO_USE="$RESOLVED_ORG_ID"

          # Response is an array of project objects; find one with matching name.
          EXISTING=$(jq -r --arg name "$SNAKZAP_PROJECT_NAME" \
            '.[] | select(.name == $name) | .id' /tmp/sb_projects.json 2>/dev/null || echo "")

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            # ------------------------------------------------------
            # Existing project found with same name — REUSE it.
            # We don't know the original DB password (it was generated
            # by a previous run and not stored). But we CAN connect
            # using the Supabase service role key if configured, OR
            # we can use the Postgres connection string from the
            # Supabase dashboard (which the user would need to provide
            # as a secret).
            #
            # For now: reuse the project, but we need the DB password.
            # Since we don't have it, we'll DELETE + re-create only if
            # a SUPABASE_DB_PASSWORD secret is NOT set.
            # ------------------------------------------------------
            echo "Existing project found with ref: $EXISTING"
            PROJECT_REF="$EXISTING"

            # Check if SUPABASE_DB_PASSWORD secret is configured
            DB_PASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}"
            if [ -n "$DB_PASSWORD" ]; then
              echo "✅ SUPABASE_DB_PASSWORD secret found — reusing existing project with stored password"
            else
              echo "⚠️  SUPABASE_DB_PASSWORD not set — need to delete + re-create project"
              echo "--- DELETE /v1/projects/$EXISTING ---"
              DELETE_HTTP=$(curl -sS -o /tmp/sb_delete.json -w "%{http_code}" \
                -X DELETE \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$EXISTING" || echo "000")
              echo "DELETE /v1/projects/$EXISTING -> HTTP $DELETE_HTTP"

              if [ "$DELETE_HTTP" != "200" ] && [ "$DELETE_HTTP" != "202" ] && [ "$DELETE_HTTP" != "204" ]; then
                echo "❌ Could not delete existing project (HTTP $DELETE_HTTP)."
                cat /tmp/sb_delete.json || true
                exit 1
              fi
              echo "✅ Existing project deleted — waiting 30s for Supabase to release the name..."
              sleep 30
              EXISTING=""
            fi
          fi

          # ------------------------------------------------------
          # No existing project (or existing project was just deleted):
          # create a fresh free-tier project.
          # Skip if we already reused an existing project above.
          # ------------------------------------------------------
          if [ -z "$PROJECT_REF" ] || [ "$PROJECT_REF" = "null" ]; then
            echo "Creating new project: $SNAKZAP_PROJECT_NAME"
            echo "--- POST /v1/projects ---"
            CREATE_HTTP=$(curl -sS -o /tmp/sb_create.json -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -H "supabase-api-version: 2024-02-15" \
              -d "$(jq -n --arg org "$ORG_ID_TO_USE" --arg name "$SNAKZAP_PROJECT_NAME" \
                      --arg region "$SNAKZAP_REGION" --arg pw "$SECURE_PASSWORD" '{
                organization_id: $org,
                name: $name,
                db_pass: $pw,
                region: $region,
                plan: "free"
              }')" || echo "000")
            echo "POST /v1/projects -> HTTP $CREATE_HTTP"
            echo "   Using org_id: $ORG_ID_TO_USE"
            echo "   Using region: $SNAKZAP_REGION"

            if [ "$CREATE_HTTP" != "200" ] && [ "$CREATE_HTTP" != "201" ]; then
              echo "❌ Project creation failed (HTTP $CREATE_HTTP)."
              echo "   Response body:"
              cat /tmp/sb_create.json || true
              echo ""
              echo "   Likely causes:"
              echo "     1. Free tier limit reached (Supabase allows max 2 free projects per org)."
              echo "        -> Delete an unused project in the Supabase dashboard, or upgrade to Pro."
              echo "     2. A project with name '$SNAKZAP_PROJECT_NAME' already exists under another org."
              echo "        -> Delete it, or change the SNAKZAP_PROJECT_NAME secret."
              echo "     3. Invalid SUPABASE_ORG_ID — find your org ID at"
              echo "        https://supabase.com/dashboard/account/org"
              echo "     4. Invalid SNAKZAP_REGION — must be a Supabase region (e.g. ap-south-1, us-east-1,"
              echo "        eu-west-1). See https://supabase.com/docs/guides/platform/regions"
              exit 1
            fi

            PROJECT_REF=$(jq -r '.id' /tmp/sb_create.json)
            if [ -z "$PROJECT_REF" ] || [ "$PROJECT_REF" = "null" ]; then
              echo "❌ Project created but no 'id' field in response:"
              cat /tmp/sb_create.json || true
              exit 1
            fi
            echo "Project created with ref: $PROJECT_REF"
            DB_PASSWORD="$SECURE_PASSWORD"
          else
            echo "✅ Reusing existing project (ref: $PROJECT_REF) — no need to create new"
          fi

          # ----------------------------------------------------------
          # Step 2: Poll for project readiness (status: ACTIVE).
          # Supabase free-tier provisioning can take several minutes;
          # poll up to 10 minutes to be safe.
          # ----------------------------------------------------------
          echo "Waiting for project to become ACTIVE (max 10 min)..."
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF" 2>/dev/null \
              | jq -r '.status // "UNKNOWN"' 2>/dev/null || echo "UNKNOWN")
            echo "  Attempt $i: status=$STATUS"
            # Accept both "ACTIVE" and "ACTIVE_HEALTHY" — newer Supabase API versions
            # return ACTIVE_HEALTHY when the project is fully ready.
            if [ "$STATUS" = "ACTIVE" ] || [ "$STATUS" = "ACTIVE_HEALTHY" ]; then
              echo "✅ Project is ready (status: $STATUS)"
              STATUS="ACTIVE"  # normalize for the check below
              break
            fi
            sleep 10
          done

          if [ "$STATUS" != "ACTIVE" ]; then
            echo "❌ Project did not become ACTIVE within 10 minutes (last status: $STATUS)."
            echo "   Check the project in the Supabase dashboard; it may still be initializing."
            exit 1
          fi
          echo "✅ Project is ACTIVE"

          # ----------------------------------------------------------
          # Step 3: Construct the connection string.
          # IMPORTANT: Supabase's direct connection (db.{ref}.supabase.co)
          # uses IPv6 which is not reachable from GitHub Actions runners.
          # We MUST use the connection pooler (IPv4) instead.
          #
          # The pooler hostname format is: aws-{region}.pooler.supabase.com
          # We get the region from the project API response (not from the
          # SNAKZAP_REGION secret, which might have formatting issues).
          # ----------------------------------------------------------
          PROJECT_REGION=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF" 2>/dev/null \
            | jq -r '.region // empty' 2>/dev/null || echo "")

          if [ -z "$PROJECT_REGION" ] || [ "$PROJECT_REGION" = "null" ]; then
            echo "⚠️  Could not determine project region from API — using SNAKZAP_REGION as fallback"
            PROJECT_REGION="${SNAKZAP_REGION//\"/}"  # strip any quotes
          fi
          echo "Project region: $PROJECT_REGION"

          ENCODED_PW=$(jq -rn --arg pw "$DB_PASSWORD" '$pw|@uri')
          # Try pooler (IPv4) first — port 5432 for session mode (required for DDL)
          DATABASE_URL="postgresql://postgres.$PROJECT_REF:${ENCODED_PW}@aws-${PROJECT_REGION}.pooler.supabase.com:5432/postgres"

          echo "project_ref=$PROJECT_REF" >> $GITHUB_OUTPUT
          echo "database_url=$DATABASE_URL" >> $GITHUB_OUTPUT
          echo "✅ Database URL constructed (value masked in logs)"

      - name: Verify PostgreSQL connectivity
        env:
          DATABASE_URL: ${{ steps.provision.outputs.database_url }}
          PROJECT_REF: ${{ steps.provision.outputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD_ENV: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client dnsutils

          # Extract password from DATABASE_URL (it's masked but still valid in the env var)
          DB_PW=$(echo "$DATABASE_URL" | sed -E 's|postgresql://[^:]+:([^@]+)@.*|\1|')
          echo "::add-mask::$DB_PW"

          # Try multiple connection strategies:
          #
          # Strategy 1: Direct connection db.{ref}.supabase.co on port 5432
          #   - This resolves to IPv6 by default (which GitHub Actions can't reach)
          #   - But we can try resolving the IPv4 A record and connect directly to the IP
          #
          # Strategy 2: Pooler connection aws-{region}.pooler.supabase.com on port 5432
          #   - May not be DNS-resolvable for newly created projects (takes hours)
          #
          # Strategy 3: Transaction pooler on port 6543 (different hostname, might work)

          echo "=== Strategy 1: Direct connection with IPv4 ==="
          DIRECT_HOST="db.${PROJECT_REF}.supabase.co"
          echo "  Resolving: $DIRECT_HOST"
          # Try both A (IPv4) and AAAA (IPv6) records
          DIRECT_IPV4=$(dig +short A "$DIRECT_HOST" 2>/dev/null | head -1)
          DIRECT_IPV6=$(dig +short AAAA "$DIRECT_HOST" 2>/dev/null | head -1)
          echo "  IPv4: ${DIRECT_IPV4:-none}"
          echo "  IPv6: ${DIRECT_IPV6:-none}"

          if [ -n "$DIRECT_IPV4" ]; then
            echo "  ✅ IPv4 found — connecting directly to IP..."
            if PGPASSWORD="$DB_PW" psql -h "$DIRECT_IPV4" -p 5432 -U "postgres.${PROJECT_REF}" -d postgres -c "SELECT version();" 2>&1; then
              echo "✅ PostgreSQL connectivity verified via direct IPv4"
              # Update DATABASE_URL to use the IPv4 address
              echo "database_url=postgresql://postgres.${PROJECT_REF}:${DB_PW}@${DIRECT_IPV4}:5432/postgres" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo ""
          echo "=== Strategy 2: Pooler connection ==="
          POOLER_HOST=$(echo "$DATABASE_URL" | sed -E 's/.*@([^:]+):.*/\1/')
          echo "  Resolving: $POOLER_HOST"
          POOLER_IPV4=$(dig +short A "$POOLER_HOST" 2>/dev/null | head -1)
          echo "  IPv4: ${POOLER_IPV4:-none}"

          if [ -n "$POOLER_IPV4" ]; then
            echo "  ✅ IPv4 found — connecting via pooler..."
            if psql "$DATABASE_URL" -c "SELECT version();" 2>&1; then
              echo "✅ PostgreSQL connectivity verified via pooler"
              exit 0
            fi
          fi

          echo ""
          echo "=== Strategy 3: Transaction pooler on port 6543 ==="
          # Try different pooler hostname formats
          for POOLER_PORT in 6543 5432; do
            for POOLER_PREFIX in "aws-ap-northeast-1" "aws-us-east-1" "aws-eu-west-1"; do
              TX_HOST="${POOLER_PREFIX}.pooler.supabase.com"
              TX_IPV4=$(dig +short A "$TX_HOST" 2>/dev/null | head -1)
              if [ -n "$TX_IPV4" ]; then
                echo "  Found pooler: $TX_HOST ($TX_IPV4) port $POOLER_PORT"
                if PGPASSWORD="$DB_PW" psql -h "$TX_IPV4" -p "$POOLER_PORT" -U "postgres.${PROJECT_REF}" -d postgres -c "SELECT version();" 2>&1; then
                  echo "✅ PostgreSQL connectivity verified via $TX_HOST:$POOLER_PORT"
                  echo "database_url=postgresql://postgres.${PROJECT_REF}:${DB_PW}@${TX_IPV4}:${POOLER_PORT}/postgres" >> $GITHUB_OUTPUT
                  exit 0
                fi
              fi
            done
          done

          echo ""
          echo "❌ All connection strategies failed."
          echo "   The Supabase project was created successfully (ref: $PROJECT_REF)."
          echo "   DNS propagation for the pooler may take several hours on the free tier."
          echo ""
          echo "   Options:"
          echo "   1. Wait 1-2 hours and re-run this workflow."
          echo "   2. Connect via Supabase Dashboard SQL Editor to verify the project works."
          echo "   3. Use a paid Supabase plan for instant pooler availability."
          exit 1

  migrate-and-revoke:
    name: Migrate Schema + Execute REVOKE
    needs: provision-postgresql
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      migration_status: ${{ steps.migrate.outputs.status }}
      revoke_status: ${{ steps.revoke.outputs.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Run PostgreSQL migration (create schema)
        id: migrate
        env:
          DATABASE_URL: ${{ needs.provision-postgresql.outputs.database_url }}
        run: |
          set -euo pipefail
          echo "=== Running PostgreSQL schema migration ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/scripts/postgres-migration.sql
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ Schema migration complete"

      - name: Create role separation (snakzap_admin + snakzap_app)
        env:
          DATABASE_URL: ${{ needs.provision-postgresql.outputs.database_url }}
        run: |
          set -euo pipefail
          echo "=== Creating application + admin roles ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/scripts/create-roles.sql
          echo "✅ Role separation complete"

      - name: Execute REVOKE UPDATE/DELETE on audit_log
        id: revoke
        env:
          DATABASE_URL: ${{ needs.provision-postgresql.outputs.database_url }}
        run: |
          set -euo pipefail
          echo "=== Executing REVOKE for production WORM boundary ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/scripts/revoke-worm.sql
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ REVOKE complete — application role cannot UPDATE/DELETE audit_log"

      - name: Seed initial data
        env:
          DATABASE_URL: ${{ needs.provision-postgresql.outputs.database_url }}
        run: |
          set -euo pipefail
          echo "=== Seeding initial data ==="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/scripts/seed-postgres.sql
          echo "✅ Seed data inserted"

  tamper-test:
    name: P0-20 Tamper Tests (PostgreSQL Privilege Boundary)
    needs: [provision-postgresql, migrate-and-revoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tamper_test_passed: ${{ steps.test.outputs.passed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client + jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client jq

      - name: Run tamper tests (positive + negative)
        id: test
        env:
          DATABASE_URL: ${{ needs.provision-postgresql.outputs.database_url }}
        run: |
          set -euo pipefail
          echo "=== Running tamper tests ==="
          chmod +x prisma/scripts/tamper-test.sh
          bash prisma/scripts/tamper-test.sh "$DATABASE_URL" > tamper-results.json 2>&1 || true
          cat tamper-results.json
          PASSED=$(jq -r '.all_passed' tamper-results.json 2>/dev/null || echo "false")
          if [ "$PASSED" = "true" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "✅ All tamper tests PASS"
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "❌ Tamper tests FAILED"
            exit 1
          fi

      - name: Upload tamper test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-001-tamper-evidence
          path: tamper-results.json
          retention-days: 90

  capture-evidence:
    name: Capture DEV-001 Closure Evidence
    needs: [provision-postgresql, migrate-and-revoke, tamper-test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tamper evidence
        uses: actions/download-artifact@v4
        id: download_tamper
        continue-on-error: true
        with:
          name: dev-001-tamper-evidence

      - name: Create placeholder if tamper evidence is missing
        if: steps.download_tamper.outcome != 'success'
        run: |
          echo '{"all_passed": "NOT_RUN", "tests": [], "reason": "tamper-test job was skipped (upstream provision/migrate step failed)"}' > tamper-results.json
          echo "⚠️  Tamper evidence artifact was not available — wrote placeholder tamper-results.json."

      - name: Build consolidated evidence JSON
        env:
          PROJECT_REF: ${{ needs.provision-postgresql.outputs.project_ref }}
          MIGRATION_STATUS: ${{ needs.migrate-and-revoke.outputs.migration_status }}
          REVOKE_STATUS: ${{ needs.migrate-and-revoke.outputs.revoke_status }}
          TAMPER_PASSED: ${{ needs.tamper-test.outputs.tamper_test_passed }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          # Merge tamper-results.json into the evidence envelope so we capture
          # per-test detail even when capture-evidence runs after an upstream failure.
          jq -n \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg project_ref "${PROJECT_REF:-NOT_PROVISIONED}" \
            --arg migration_status "${MIGRATION_STATUS:-NOT_RUN}" \
            --arg revoke_status "${REVOKE_STATUS:-NOT_RUN}" \
            --arg tamper_passed "${TAMPER_PASSED:-NOT_RUN}" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_RUN_URL" \
            --slurpfile tamper tamper-results.json \
            '{
              capability: "DEV-001 / P0-22 Production WORM Closure",
              timestamp: $timestamp,
              environment: {
                provider: "Supabase",
                project_ref: $project_ref,
                database: "PostgreSQL (managed)"
              },
              execution: {
                workflow_run_id: $run_id,
                workflow_run_url: $run_url
              },
              steps: {
                schema_migration: $migration_status,
                role_separation: "snakzap_admin (DDL) + snakzap_app (DML, no UPDATE/DELETE on audit_log)",
                revoke_executed: $revoke_status,
                tamper_tests: $tamper_passed
              },
              tamper_detail: ($tamper[0] // null),
              verdict: (if ($tamper_passed == "true") then "PASS_CANDIDATE" else "FAIL" end),
              governance_note: "Evidence subject to independent G/H review before Wave-0 closure"
            }' > dev-001-evidence.json

          cat dev-001-evidence.json

      - name: Upload consolidated evidence
        uses: actions/upload-artifact@v4
        with:
          name: dev-001-closure-evidence
          path: dev-001-evidence.json
          retention-days: 365

      - name: Print evidence summary
        run: |
          echo ""
          echo "================================================"
          echo "  DEV-001 / P0-22 PRODUCTION WORM CLOSURE"
          echo "================================================"
          cat dev-001-evidence.json | jq -r '
            "Timestamp:        \(.timestamp)",
            "Provider:         \(.environment.provider)",
            "Project Ref:      \(.environment.project_ref)",
            "Database:         \(.environment.database)",
            "",
            "Workflow Run:     \(.execution.workflow_run_url)",
            "",
            "Schema Migration: \(.steps.schema_migration)",
            "Role Separation:  \(.steps.role_separation)",
            "REVOKE Executed:  \(.steps.revoke_executed)",
            "Tamper Tests:     \(.steps.tamper_tests)",
            "",
            "VERDICT:          \(.verdict)",
            "",
            "Note: \(.governance_note)"
          '
          echo "================================================"
