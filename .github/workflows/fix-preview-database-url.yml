# =============================================================================
# P0-27 Phase 2 — Fix Preview DATABASE_URL → snakzap_app
# -----------------------------------------------------------------------------
# DISCREPANCY FOUND:
#   The vercel-env-config.yml workflow constructed DATABASE_URL with username
#   `postgres.<project-ref>` (the postgres SUPERUSER), NOT `snakzap_app`.
#   This violates Orchestrator authorization #4:
#     "DATABASE_URL MUST use snakzap_app / Transaction Pooler."
#   and bypasses the DEV-001 WORM boundary (postgres superuser can
#   UPDATE/DELETE/TRUNCATE AuditLog — the REVOKE is meaningless against a
#   superuser).
#
# THIS WORKFLOW:
#   1. Queries Supabase Management API for the correct pooler hostname.
#   2. Constructs DATABASE_URL with username `snakzap_app.<project-ref>`
#      (supavisor format for custom roles), port 6543 (Transaction Pooler),
#      ?pgbouncer=true&connection_limit=1.
#   3. Deletes the existing PREVIEW DATABASE_URL on Vercel and creates a new
#      one with the snakzap_app connection string.
#   4. Does NOT touch production env vars (per Orchestrator authorization #7).
#
# snakzap_app password source: prisma/scripts/create-roles.sql (placeholder
# 'CHANGE_ME_IN_PRODUCTION_USE_SECRET_MANAGER' — executed verbatim via
# dev-001-sql-execution.yml Management API, no substitution).
# =============================================================================

name: Fix Preview DATABASE_URL (snakzap_app)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type FIX-PREVIEW-DB to confirm'
        required: true
        default: ''

jobs:
  fix:
    name: Fix preview DATABASE_URL → snakzap_app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify trigger
        run: |
          [ "${{ github.event.inputs.confirm }}" = "FIX-PREVIEW-DB" ] || { echo "❌ Wrong confirmation"; exit 1; }
          echo "✅ Authorized — Fix preview DATABASE_URL → snakzap_app"

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Verify secrets present
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "❌ VERCEL_TOKEN NOT_SET"; exit 1; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "❌ VERCEL_PROJECT_ID NOT_SET"; exit 1; }
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "❌ SUPABASE_ACCESS_TOKEN NOT_SET"; exit 1; }
          echo "✅ All required secrets present"

      - name: Query Supabase pooler hostname
        id: supabase
        run: |
          PROJECT_REF="zmzqqcyapcezmaqvuzzd"

          echo "=== Querying Supabase database config (read-only) ==="
          DB_CONFIG=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database" 2>/dev/null || echo "{}")

          echo "DB config response (keys only — values may be sensitive):"
          echo "$DB_CONFIG" | jq 'keys' 2>/dev/null || echo "$DB_CONFIG" | head -c 500

          # Try to extract pooler hostname from various possible response fields
          POOLER_HOST=$(echo "$DB_CONFIG" | jq -r '
            .pooler_dns_name //
            .pooler_host //
            .connection_pooler_dns_name //
            .pooler.url //
            empty' 2>/dev/null)

          if [ -z "$POOLER_HOST" ] || [ "$POOLER_HOST" = "null" ]; then
            echo ""
            echo "⚠️  Pooler hostname not in API response — using standard Supabase supavisor format"
            POOLER_HOST="aws-0.ap-northeast-1.pooler.supabase.com"
          else
            echo ""
            echo "✅ Pooler hostname from API: $POOLER_HOST"
          fi

          echo "pooler_host=$POOLER_HOST" >> $GITHUB_OUTPUT
          echo "project_ref=$PROJECT_REF" >> $GITHUB_OUTPUT

      - name: Construct DATABASE_URL for snakzap_app
        id: url
        run: |
          PROJECT_REF="${{ steps.supabase.outputs.project_ref }}"
          POOLER_HOST="${{ steps.supabase.outputs.pooler_host }}"

          # snakzap_app password — from prisma/scripts/create-roles.sql (placeholder,
          # executed verbatim via dev-001-sql-execution.yml Management API)
          APP_PASSWORD="CHANGE_ME_IN_PRODUCTION_USE_SECRET_MANAGER"

          # URL-encode the password (handles special characters safely)
          ENCODED_PW=$(jq -rn --arg pw "$APP_PASSWORD" '$pw|@uri')

          # Construct DATABASE_URL for snakzap_app via Transaction Pooler (port 6543)
          # Supavisor username format for custom roles: <role>.<project-ref>
          DATABASE_URL="postgresql://snakzap_app.$PROJECT_REF:$ENCODED_PW@$POOLER_HOST:6543/postgres?pgbouncer=true&connection_limit=1"
          echo "::add-mask::$DATABASE_URL"

          echo "✅ DATABASE_URL constructed for snakzap_app:"
          echo "  username : snakzap_app.$PROJECT_REF"
          echo "  host     : $POOLER_HOST:6543"
          echo "  pooler   : transaction (pgbouncer=true, connection_limit=1)"
          echo "  database : postgres"

          echo "database_url=$DATABASE_URL" >> $GITHUB_OUTPUT

      - name: Update Vercel preview DATABASE_URL
        env:
          DB_URL: ${{ steps.url.outputs.database_url }}
        run: |
          set -e
          PROJECT_ID="$VERCEL_PROJECT_ID"
          API_URL="https://api.vercel.com/v10/projects/$PROJECT_ID/env"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"

          echo "=== Step 1: Find existing PREVIEW DATABASE_URL entries ==="
          ENV_LIST=$(curl -sS -H "$AUTH" "$API_URL")
          EXISTING_IDS=$(echo "$ENV_LIST" | jq -r '.envs[] | select(.key == "DATABASE_URL" and (.target | contains(["preview"]))) | .id')

          if [ -z "$EXISTING_IDS" ]; then
            echo "  No existing preview DATABASE_URL found."
          else
            for ID in $EXISTING_IDS; do
              echo "  Deleting existing preview DATABASE_URL (id=$ID)"
              curl -sS -X DELETE -H "$AUTH" "$API_URL/$ID" > /dev/null
            done
            echo "  Deleted."
          fi

          echo ""
          echo "=== Step 2: Create new PREVIEW DATABASE_URL (snakzap_app) ==="
          RESULT=$(curl -sS -X POST \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            "$API_URL" \
            -d "$(jq -n --arg v "$DB_URL" '{
              key: "DATABASE_URL",
              value: $v,
              target: ["preview"],
              type: "encrypted"
            }')")

          NEW_ID=$(echo "$RESULT" | jq -r '.id // empty')
          if [ -n "$NEW_ID" ]; then
            echo "  ✅ Created preview DATABASE_URL (id=$NEW_ID) — snakzap_app"
          else
            echo "  ❌ Failed to create: $(echo "$RESULT" | jq -r '.error.message // .error // "unknown"')"
            exit 1
          fi

      - name: Verify final state
        run: |
          echo "=== Verifying Vercel env vars (read-only) ==="
          ENV_LIST=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env")

          echo ""
          echo "All DATABASE_URL entries:"
          echo "$ENV_LIST" | jq -r '.envs[] | select(.key == "DATABASE_URL") | "  id=\(.id)  target=\(.target | join(","))  type=\(.type)"'

          echo ""
          echo "Total env vars on project: $(echo "$ENV_LIST" | jq '.envs | length')"

          echo ""
          echo "✅ Preview DATABASE_URL updated to snakzap_app (Transaction Pooler port 6543)"
          echo "ℹ️  Production DATABASE_URL NOT modified (per Orchestrator authorization #7)"
