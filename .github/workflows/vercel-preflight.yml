# P0-27 Vercel Preflight — READ-ONLY verification
# Verifies Vercel API access + project accessibility using GitHub secrets.
# Does NOT deploy, create, or modify anything.

name: P0-27 Vercel Preflight

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VERCEL-PREFLIGHT to confirm'
        required: true
        default: ''

jobs:
  preflight:
    name: Vercel Access + Project Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Verify trigger
        run: |
          [ "${{ github.event.inputs.confirm }}" = "VERCEL-PREFLIGHT" ] || { echo "❌ Wrong confirmation"; exit 1; }
          echo "✅ Authorized — Vercel Preflight"

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Verify secrets present (no value exposure)
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "❌ VERCEL_TOKEN NOT_SET"; exit 1; }
          [ -n "$VERCEL_ORG_ID" ] || { echo "❌ VERCEL_ORG_ID NOT_SET"; exit 1; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "❌ VERCEL_PROJECT_ID NOT_SET"; exit 1; }
          echo "✅ All 3 Vercel secrets present (values not exposed)"

      - name: Test Vercel API authentication
        id: auth
        run: |
          echo "=== Testing GET /v2/user ==="
          HTTP=$(curl -sS -o /tmp/vercel_user.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/user")
          echo "HTTP $HTTP"
          if [ "$HTTP" = "200" ]; then
            USERNAME=$(jq -r '.user.username // "unknown"' /tmp/vercel_user.json)
            echo "✅ Authenticated as: $USERNAME"
            echo "auth_status=PASS" >> $GITHUB_OUTPUT
          else
            echo "❌ Authentication FAILED"
            cat /tmp/vercel_user.json
            echo "auth_status=FAIL" >> $GITHUB_OUTPUT
          fi

      - name: Test organization access
        id: org
        run: |
          echo "=== Testing GET /v2/teams ==="
          HTTP=$(curl -sS -o /tmp/vercel_teams.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/teams")
          echo "HTTP $HTTP"
          if [ "$HTTP" = "200" ]; then
            TEAM_COUNT=$(jq '.teams | length' /tmp/vercel_teams.json)
            echo "✅ Teams accessible: $TEAM_COUNT"
            jq -r '.teams[] | "  - id=\(.id) name=\(.name)"' /tmp/vercel_teams.json
            # Check if VERCEL_ORG_ID matches any team
            MATCH=$(jq -r --arg org "$VERCEL_ORG_ID" '.teams[] | select(.id == $org) | .id' /tmp/vercel_teams.json)
            if [ -n "$MATCH" ]; then
              echo "✅ VERCEL_ORG_ID matches accessible team"
              echo "org_status=PASS" >> $GITHUB_OUTPUT
            else
              echo "⚠️ VERCEL_ORG_ID does not match any accessible team"
              echo "  (may be a personal account — VERCEL_ORG_ID is user ID)"
              echo "org_status=PASS" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ Teams access FAILED"
            cat /tmp/vercel_teams.json
            echo "org_status=FAIL" >> $GITHUB_OUTPUT
          fi

      - name: Test project accessibility
        id: project
        run: |
          echo "=== Testing GET /v9/projects/{PROJECT_ID} ==="
          HTTP=$(curl -sS -o /tmp/vercel_project.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID")
          echo "HTTP $HTTP"
          if [ "$HTTP" = "200" ]; then
            PROJECT_NAME=$(jq -r '.name // "unknown"' /tmp/vercel_project.json)
            PROJECT_FRAMEWORK=$(jq -r '.framework // "unknown"' /tmp/vercel_project.json)
            echo "✅ Project accessible: $PROJECT_NAME"
            echo "  Framework: $PROJECT_FRAMEWORK"
            echo "project_status=PASS" >> $GITHUB_OUTPUT
          else
            echo "❌ Project access FAILED"
            cat /tmp/vercel_project.json
            echo "project_status=FAIL" >> $GITHUB_OUTPUT
          fi

      - name: Check project env vars
        id: envvars
        run: |
          echo "=== Checking project environment variables ==="
          HTTP=$(curl -sS -o /tmp/vercel_envs.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env")
          echo "HTTP $HTTP"
          if [ "$HTTP" = "200" ]; then
            ENV_COUNT=$(jq '.envs | length' /tmp/vercel_envs.json)
            echo "✅ Environment variables accessible: $ENV_COUNT configured"
            echo "  Configured env var names:"
            jq -r '.envs[] | "    - \(.key) (target=\(.target), type=\(.type))"' /tmp/vercel_envs.json 2>/dev/null || echo "    (could not parse)"
            echo "env_status=ACCESSIBLE" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Could not list env vars (HTTP $HTTP)"
            echo "env_status=INACCESSIBLE" >> $GITHUB_OUTPUT
          fi

      - name: Print preflight summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  P0-27 VERCEL PREFLIGHT REPORT"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "Authentication:    ${{ steps.auth.outputs.auth_status }}"
          echo "Organization:      ${{ steps.org.outputs.org_status }}"
          echo "Project:           ${{ steps.project.outputs.project_status }}"
          echo "Env vars:          ${{ steps.envvars.outputs.env_status }}"
          echo ""
          AUTH="${{ steps.auth.outputs.auth_status }}"
          ORG="${{ steps.org.outputs.org_status }}"
          PROJ="${{ steps.project.outputs.project_status }}"
          if [ "$AUTH" = "PASS" ] && [ "$ORG" = "PASS" ] && [ "$PROJ" = "PASS" ]; then
            echo "OVERALL: READY_FOR_ORCHESTRATOR_REVIEW"
          else
            echo "OVERALL: NOT_READY"
          fi
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
