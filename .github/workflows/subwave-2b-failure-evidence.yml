name: Sub-Wave 2b — Crash + Retry + Poison + Dedup Evidence

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging URL'
        required: true

jobs:
  failure-evidence:
    name: 2b-3/2b-4/2b-8 empirical failure-injection evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zmzqqcyapcezmaqvuzzd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: 2b-3 Crash Recovery + 2b-4 Retry/Poison + 2b-8 Dedup Evidence
        env:
          STAGING_URL: ${{ inputs.staging_url }}
        run: |
          STAGING_URL="${STAGING_URL%/}"
          APP_PASSWORD="CHANGE_ME_IN_PRODUCTION_USE_SECRET_MANAGER"
          ENCODED_PW=$(jq -rn --arg pw "$APP_PASSWORD" '$pw|@uri')
          PUBLISHER_DB_URL="postgresql://snakzap_app.zmzqqcyapcezmaqvuzzd:$ENCODED_PW@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=1"

          # Helper: query Supabase DB
          query_db() {
            local sql="$1"
            echo "$sql" > /tmp/query.sql
            jq -n --rawfile sql /tmp/query.sql '{query: $sql}' | \
              curl -sS -X POST \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -d @-
          }

          # Helper: run publisher for N seconds
          run_publisher() {
            local seconds="$1"
            export DATABASE_URL="$PUBLISHER_DB_URL"
            export REALTIME_URL="$STAGING_URL"
            export OUTBOX_PUBLISHER_PORT=$((3009 + RANDOM % 100))
            export OUTBOX_PUBLISHER_AUTO_RUN=true
            timeout "$seconds" bun run mini-services/outbox-publisher/index.ts 2>&1 || true
          }

          # Helper: create an outbox row directly via Supabase API (for controlled tests)
          create_outbox_row() {
            local event_id="$1"
            local event_type="$2"
            local payload="$3"
            # Write SQL to file using printf (avoids shell expansion of $ in JSON)
            printf 'INSERT INTO "Outbox" ("id", "eventId", "eventType", "aggregateType", "aggregateId", "payload", "status", "attempts", "createdAt") VALUES (gen_random_uuid()::text, '"'"'%s'"'"', '"'"'%s'"'"', '"'"'Test'"'"', '"'"'test-%s'"'"', '"'"'%s'"'"', '"'"'PENDING'"'"', 0, NOW());' "$event_id" "$event_type" "$event_id" "$payload" > /tmp/insert_outbox.sql
            jq -n --rawfile sql /tmp/insert_outbox.sql '{query: $sql}' | \
              curl -sS -X POST \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -d @- > /dev/null 2>&1
          }

          # Helper: get outbox row status
          get_outbox_status() {
            local event_id="$1"
            local sql="SELECT \"eventId\", \"status\", \"attempts\", \"workerId\", \"claimedAt\", \"claimUntil\", \"publishedAt\", \"lastError\" FROM \"Outbox\" WHERE \"eventId\" = '$event_id';"
            query_db "$sql"
          }

          echo "═══════════════════════════════════════════════════════════════"
          echo "  2b-3 CRASH RECOVERY EVIDENCE"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          # Step 1: Create a test outbox row
          CRASH_EVENT_ID="crash-test-$(date +%s)"
          echo "=== Step 1: Create outbox row (eventId=$CRASH_EVENT_ID) ==="
          create_outbox_row "$CRASH_EVENT_ID" "ORDER_CREATED" '{"orderId":"crash-test","status":"CONFIRMED"}'
          BEFORE=$(get_outbox_status "$CRASH_EVENT_ID")
          echo "Before: $BEFORE"
          BEFORE_STATUS=$(echo "$BEFORE" | jq -r '.[0].status' 2>/dev/null)
          echo "Status before: $BEFORE_STATUS (expected: PENDING)"

          # Step 2: Simulate crash by manually claiming the event (set to CLAIMED with short lease)
          echo ""
          echo "=== Step 2: Simulate crash — claim event with 5-second lease ==="
          CRASH_SQL="UPDATE \"Outbox\" SET status='CLAIMED', \"claimedAt\"=NOW(), \"claimUntil\"=NOW() + INTERVAL '5 seconds', \"workerId\"='crashed-worker' WHERE \"eventId\"='$CRASH_EVENT_ID';"
          query_db "$CRASH_SQL" > /dev/null 2>&1
          CLAIMED=$(get_outbox_status "$CRASH_EVENT_ID")
          echo "After claim: $CLAIMED"
          CLAIMED_STATUS=$(echo "$CLAIMED" | jq -r '.[0].status' 2>/dev/null)
          echo "Status after claim: $CLAIMED_STATUS (expected: CLAIMED)"

          # Step 3: Wait for lease to expire
          echo ""
          echo "=== Step 3: Wait 7 seconds for lease to expire ==="
          sleep 7
          LEASE_EXPIRED=$(get_outbox_status "$CRASH_EVENT_ID")
          echo "After lease expiry: $LEASE_EXPIRED"
          LEASE_STATUS=$(echo "$LEASE_EXPIRED" | jq -r '.[0].status' 2>/dev/null)
          echo "Status after lease expiry: $LEASE_STATUS (still CLAIMED — publisher hasn't recovered yet)"

          # Step 4: Run publisher (should recover the stale CLAIMED event)
          echo ""
          echo "=== Step 4: Run publisher (should recover stale CLAIMED → PENDING → PUBLISHED) ==="
          run_publisher 15

          # Step 5: Verify event is PUBLISHED (recovered)
          sleep 2
          AFTER=$(get_outbox_status "$CRASH_EVENT_ID")
          echo "After recovery: $AFTER"
          AFTER_STATUS=$(echo "$AFTER" | jq -r '.[0].status' 2>/dev/null)
          AFTER_PUBLISHED_AT=$(echo "$AFTER" | jq -r '.[0].publishedAt // empty' 2>/dev/null)
          echo "Final status: $AFTER_STATUS (expected: PUBLISHED)"

          CRASH_OK="false"
          if [ "$BEFORE_STATUS" = "PENDING" ] && [ "$CLAIMED_STATUS" = "CLAIMED" ] && [ "$AFTER_STATUS" = "PUBLISHED" ]; then
            CRASH_OK="true"
            echo "✅ CRASH RECOVERY PASS: event went PENDING→CLAIMED(crash)→recovered→PUBLISHED"
          else
            echo "❌ CRASH RECOVERY FAIL: expected PENDING→CLAIMED→PUBLISHED, got $BEFORE_STATUS→$CLAIMED_STATUS→$AFTER_STATUS"
          fi

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  2b-4b POISON EVENT EVIDENCE"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          # Create a poison event with an unknown event type (will always fail)
          POISON_EVENT_ID="poison-test-$(date +%s)"
          echo "=== Step 1: Create poison outbox row (eventId=$POISON_EVENT_ID, unknown eventType) ==="
          create_outbox_row "$POISON_EVENT_ID" "UNKNOWN_POISON_EVENT_TYPE" '{"test":"poison"}'
          POISON_BEFORE=$(get_outbox_status "$POISON_EVENT_ID")
          echo "Before: $POISON_BEFORE"

          # Step 2: Run publisher 5 times (each run attempts once)
          echo ""
          echo "=== Step 2: Run publisher 5 times (simulating 5 retry cycles) ==="
          for i in 1 2 3 4 5; do
            echo "--- Attempt $i ---"
            # Reset claimUntil to allow immediate retry (bypass backoff for test)
            RESET_SQL="UPDATE \"Outbox\" SET \"claimUntil\"=NOW() - INTERVAL '1 second' WHERE \"eventId\"='$POISON_EVENT_ID' AND status='PENDING';"
            query_db "$RESET_SQL" > /dev/null 2>&1
            run_publisher 10
            POISON_STATUS=$(get_outbox_status "$POISON_EVENT_ID")
            POISON_ATTEMPTS=$(echo "$POISON_STATUS" | jq -r '.[0].attempts // 0' 2>/dev/null)
            POISON_STATE=$(echo "$POISON_STATUS" | jq -r '.[0].status // empty' 2>/dev/null)
            echo "After attempt $i: status=$POISON_STATE, attempts=$POISON_ATTEMPTS"
          done

          # Step 3: Verify FAILED after exactly 5 attempts
          POISON_FINAL=$(get_outbox_status "$POISON_EVENT_ID")
          POISON_FINAL_STATUS=$(echo "$POISON_FINAL" | jq -r '.[0].status' 2>/dev/null)
          POISON_FINAL_ATTEMPTS=$(echo "$POISON_FINAL" | jq -r '.[0].attempts // 0' 2>/dev/null)
          POISON_FINAL_ERROR=$(echo "$POISON_FINAL" | jq -r '.[0].lastError // empty' 2>/dev/null)
          echo ""
          echo "Final: status=$POISON_FINAL_STATUS, attempts=$POISON_FINAL_ATTEMPTS, lastError=$POISON_FINAL_ERROR"

          POISON_OK="false"
          if [ "$POISON_FINAL_STATUS" = "FAILED" ] && [ "$POISON_FINAL_ATTEMPTS" -ge 5 ]; then
            POISON_OK="true"
            echo "✅ POISON EVENT PASS: after $POISON_FINAL_ATTEMPTS attempts → FAILED (no infinite retry)"
          else
            echo "❌ POISON EVENT FAIL: expected FAILED after 5 attempts, got status=$POISON_FINAL_STATUS attempts=$POISON_FINAL_ATTEMPTS"
          fi

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  2b-8 DUPLICATE DELIVERY → EXACTLY 1 BUSINESS EFFECT"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          # Test processEvent() directly (the consumer-side dedup library)
          # We simulate 3× delivery of the same eventId and verify that
          # processEvent() returns processed=true only once, and
          # ProcessedEvent table has exactly 1 row.
          DEDUP_EVENT_ID="dedup-test-$(date +%s)"

          echo "=== Step 1: Simulate 3× delivery of eventId=$DEDUP_EVENT_ID ==="
          cat > dedup-test.mjs << 'DEDUP_SCRIPT'
          import { PrismaClient } from "@prisma/client"
          import { processEvent } from "./src/lib/event-consumer.js"

          const db = new PrismaClient()
          const eventId = process.argv[2]
          let processedCount = 0

          for (let i = 1; i <= 3; i++) {
            const result = await processEvent(
              db,
              eventId,
              "ORDER_CREATED",
              async (tx) => {
                // Business effect (e.g., increment a counter)
                processedCount++
              }
            )
            console.log(JSON.stringify({ delivery: i, processed: result.processed }))
          }

          // Check ProcessedEvent count
          const peCount = await db.processedEvent.count({ where: { eventId } })
          console.log(JSON.stringify({ processedEventCount: peCount, businessEffectCount: processedCount }))

          await db.$disconnect()
          DEDUP_SCRIPT

          # Run from project root so imports resolve correctly
          DEDUP_RESULT=$(bun run dedup-test.mjs "$DEDUP_EVENT_ID" 2>&1 || echo '{"error":"bun run failed"}')
          echo "Dedup test result: $DEDUP_RESULT"

          PROCESSED_COUNT=$(echo "$DEDUP_RESULT" | grep -o '"processedEventCount":[0-9]*' | grep -o '[0-9]*' || echo "0")
          BUSINESS_EFFECT_COUNT=$(echo "$DEDUP_RESULT" | grep -o '"businessEffectCount":[0-9]*' | grep -o '[0-9]*' || echo "0")
          echo "ProcessedEvent count: $PROCESSED_COUNT (expected: 1)"
          echo "Business effect count: $BUSINESS_EFFECT_COUNT (expected: 1)"

          DEDUP_OK="false"
          if [ "$PROCESSED_COUNT" = "1" ] && [ "$BUSINESS_EFFECT_COUNT" = "1" ]; then
            DEDUP_OK="true"
            echo "✅ DEDUP PASS: 3× delivery → exactly 1 ProcessedEvent + 1 business effect"
          else
            echo "❌ DEDUP FAIL: expected 1 ProcessedEvent + 1 business effect, got $PROCESSED_COUNT + $BUSINESS_EFFECT_COUNT"
          fi

          # Cleanup
          CLEANUP_SQL="DELETE FROM \"ProcessedEvent\" WHERE \"eventId\" = '$DEDUP_EVENT_ID';"
          query_db "$CLEANUP_SQL" > /dev/null 2>&1

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  EVIDENCE SUMMARY"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "  2b-3 Crash Recovery:        $([ "$CRASH_OK" = "true" ] && echo "✅ PASS" || echo "❌ FAIL")"
          echo "  2b-4 Poison Event:          $([ "$POISON_OK" = "true" ] && echo "✅ PASS" || echo "❌ FAIL")"
          echo "  2b-8 Duplicate Delivery:    $([ "$DEDUP_OK" = "true" ] && echo "✅ PASS" || echo "❌ FAIL")"
          echo ""

          # Emit JSON evidence
          jq -n \
            --argjson ok "$([ "$CRASH_OK" = "true" ] && [ "$POISON_OK" = "true" ] && [ "$DEDUP_OK" = "true" ] && echo true || echo false)" \
            --argjson crashOk "$CRASH_OK" \
            --argjson poisonOk "$POISON_OK" \
            --argjson dedupOk "$DEDUP_OK" \
            --arg crashEventId "$CRASH_EVENT_ID" \
            --arg poisonEventId "$POISON_EVENT_ID" \
            --arg dedupEventId "$DEDUP_EVENT_ID" \
            --arg crashFinalStatus "$AFTER_STATUS" \
            --arg poisonFinalStatus "$POISON_FINAL_STATUS" \
            --argjson poisonAttempts "$POISON_FINAL_ATTEMPTS" \
            --argjson dedupProcessedCount "$PROCESSED_COUNT" \
            --arg stagingUrl "$STAGING_URL" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              ok: $ok,
              timestamp: $timestamp,
              stagingUrl: $stagingUrl,
              tests: {
                "2b-3-crash-recovery": {
                  ok: ($crashOk == "true"),
                  eventId: $crashEventId,
                  description: "Event claimed by crashed worker → lease expired → publisher recovered → PUBLISHED",
                  finalStatus: $crashFinalStatus,
                  noEventLoss: ($crashFinalStatus == "PUBLISHED")
                },
                "2b-4-poison-event": {
                  ok: ($poisonOk == "true"),
                  eventId: $poisonEventId,
                  description: "Unknown event type → 5 attempts → FAILED (no infinite retry)",
                  finalStatus: $poisonFinalStatus,
                  attempts: $poisonAttempts,
                  noInfiniteRetry: (($poisonFinalStatus == "FAILED") and ($poisonAttempts >= 5))
                },
                "2b-8-duplicate-delivery": {
                  ok: ($dedupOk == "true"),
                  eventId: $dedupEventId,
                  description: "3x delivery -> exactly 1 ProcessedEvent (business effect applied once)",
                  processedEventCount: $dedupProcessedCount,
                  exactlyOnce: ($dedupProcessedCount == 1)
                }
              }
            }' > 2b-failure-evidence.json

          echo "=== Evidence JSON ==="
          cat 2b-failure-evidence.json | jq '.'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subwave-2b-failure-evidence
          path: 2b-failure-evidence.json
          retention-days: 90
