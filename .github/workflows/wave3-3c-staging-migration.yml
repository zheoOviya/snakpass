# Wave-3 Sub-Wave 3c — Apply Staging Migration
# Adds requestHash column to IdempotencyKey table (Class-2 ADDITIVE)

name: Wave-3 3c — Apply Staging Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-WAVE3-3C to confirm'
        required: true
        default: ''

jobs:
  migrate:
    name: Apply Wave-3 3c schema migration to staging Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zmzqqcyapcezmaqvuzzd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify trigger
        run: |
          [ "${{ github.event.inputs.confirm }}" = "APPLY-WAVE3-3C" ] || { echo "❌ Wrong confirmation"; exit 1; }
          echo "✅ Authorized — Wave-3 Sub-Wave 3c staging migration"

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Verify secrets present
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "❌ SUPABASE_ACCESS_TOKEN NOT_SET"; exit 1; }
          echo "✅ Secrets present"

      - name: Apply migration via Supabase Management API
        run: |
          echo "=== Applying Wave-3 3c migration to staging Supabase ==="
          RESULT=$(jq -n --rawfile sql prisma/scripts/wave3-subwave-3c-migration.sql '{query: $sql}' | \
            curl -sS -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -d @-)
          echo "$RESULT"
          echo "=== Migration complete ==="

      - name: Verify schema (requestHash column exists)
        run: |
          echo "=== Verifying requestHash column exists ==="
          VERIFY_SQL='SELECT (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''IdempotencyKey'\'' AND column_name = '\''requestHash'\'') AS requesthash_col;'
          RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$VERIFY_SQL" '{query: $q}')")
          echo "$RESULT" | jq '.' 2>/dev/null || echo "$RESULT"
          echo "=== Verification complete ==="
