# DEV-001 — Evidence Gap Closure v3
# Uses has_table_privilege() — PostgreSQL's built-in runtime privilege check
# Returns EXPLICIT result rows with actual/denied status + error codes

name: DEV-001 Evidence Gap Closure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CLOSE-GAP to confirm'
        required: true
        default: ''

jobs:
  close-gap:
    name: Runtime Privilege Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zmzqqcyapcezmaqvuzzd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify trigger
        run: |
          [ "${{ github.event.inputs.confirm }}" = "CLOSE-GAP" ] || { echo "❌ Wrong confirmation"; exit 1; }
          echo "✅ Authorized"

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Execute runtime privilege check
        run: |
          echo "=== Runtime privilege check via has_table_privilege() ==="
          # has_table_privilege() takes table name as TEXT — must match the
          # actual table name. In PostgreSQL, "AuditLog" is stored as "AuditLog"
          # (case-sensitive because quoted in CREATE TABLE). The function accepts
          # the name with proper quoting.
          SQL=$(cat << 'SQLEOF'
          SELECT 'INSERT' AS operation, 'ALLOWED' AS expected, CASE WHEN has_table_privilege('snakzap_app', '"AuditLog"', 'INSERT') THEN 'ALLOWED' ELSE 'DENIED' END AS actual
          UNION ALL
          SELECT 'SELECT', 'ALLOWED', CASE WHEN has_table_privilege('snakzap_app', '"AuditLog"', 'SELECT') THEN 'ALLOWED' ELSE 'DENIED' END
          UNION ALL
          SELECT 'UPDATE', 'DENIED', CASE WHEN has_table_privilege('snakzap_app', '"AuditLog"', 'UPDATE') THEN 'ALLOWED' ELSE 'DENIED' END
          UNION ALL
          SELECT 'DELETE', 'DENIED', CASE WHEN has_table_privilege('snakzap_app', '"AuditLog"', 'DELETE') THEN 'ALLOWED' ELSE 'DENIED' END
          UNION ALL
          SELECT 'TRUNCATE', 'DENIED', CASE WHEN has_table_privilege('snakzap_app', '"AuditLog"', 'TRUNCATE') THEN 'ALLOWED' ELSE 'DENIED' END;
          SQLEOF
          )
          PAYLOAD=$(jq -n --arg q "$SQL" '{query: $q}')
          RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$PAYLOAD")
          echo "$RESULT" > tamper-test-results.json
          echo "=== RAW RESULT ==="
          cat tamper-test-results.json
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  DEV-001 RUNTIME PRIVILEGE CHECK"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          cat tamper-test-results.json | jq -r '
            .[] |
            "Operation: \(.operation)",
            "  Expected: \(.expected)",
            "  Actual:   \(.actual)",
            ""
          ' 2>/dev/null || echo "(Could not parse JSON — see raw output above)"
          echo "═══════════════════════════════════════════════════════════════"
          echo "  VERDICT"
          echo "═══════════════════════════════════════════════════════════════"
          cat tamper-test-results.json | jq -r '
            if all(.[] | select(.expected == "DENIED") | .actual == "DENIED") then
              "PASS_CANDIDATE — all DENIED operations confirmed denied"
            else
              "FAIL — WORM boundary VIOLATED"
            end
          ' 2>/dev/null || echo "INCOMPLETE"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-001-gap-closure-evidence
          path: tamper-test-results.json
          retention-days: 365

      - name: Print summary
        if: always()
        run: |
          echo ""
          echo "================================================"
          echo "  DEV-001 EVIDENCE GAP CLOSURE SUMMARY"
          echo "================================================"
          echo "Execution method: has_table_privilege() (PostgreSQL runtime ACL check)"
          echo "Effective role checked: snakzap_app"
          echo "Table: AuditLog"
          echo ""
          echo "Results:"
          cat tamper-test-results.json 2>/dev/null | jq '.' 2>/dev/null || echo "(see raw output)"
          echo ""
          echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "================================================"
