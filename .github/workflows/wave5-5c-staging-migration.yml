# Wave-5 Sub-Wave 5C — Apply Staging Migration (RemediationAction table)
# Adds the RemediationAction table (Class-2 ADDITIVE — M16-only scoped)

name: Wave-5 5C — Apply Staging Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-WAVE5-5C to confirm'
        required: true
        default: ''

jobs:
  migrate:
    name: Apply Wave-5 5C schema migration to staging Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zmzqqcyapcezmaqvuzzd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify trigger
        run: |
          [ "${{ github.event.inputs.confirm }}" = "APPLY-WAVE5-5C" ] || { echo "❌ Wrong confirmation"; exit 1; }
          echo "✅ Authorized — Wave-5 Sub-Wave 5C staging migration (RemediationAction table — M16-only)"

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Verify secrets present
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "❌ SUPABASE_ACCESS_TOKEN NOT_SET"; exit 1; }
          echo "✅ Secrets present"

      - name: Apply migration via Supabase Management API
        run: |
          echo "=== Applying Wave-5 5C migration to staging Supabase ==="
          RESULT=$(jq -n --rawfile sql prisma/scripts/wave5-subwave-5c-migration.sql '{query: $sql}' | \
            curl -sS -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -d @-)
          echo "$RESULT"
          echo "=== Migration complete ==="

      - name: Verify schema (RemediationAction table exists with expected columns + indexes)
        run: |
          echo "=== Verifying RemediationAction table ==="
          VERIFY_SQL='SELECT (SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '\''RemediationAction'\'') AS remediation_table, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''RemediationAction'\'' AND column_name = '\''findingId'\'') AS remediation_findingid, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''RemediationAction'\'' AND column_name = '\''repairType'\'') AS remediation_repairtype, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''RemediationAction'\'' AND column_name = '\''status'\'') AS remediation_status, (SELECT COUNT(*) FROM pg_indexes WHERE indexname = '\''RemediationAction_findingId_repairType_key'\'') AS remediation_unique_idx;'
          RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$VERIFY_SQL" '{query: $q}')")
          echo "$RESULT" | jq '.' 2>/dev/null || echo "$RESULT"
          echo "=== Verification complete ==="

      - name: Verify Wave-3/4/5A tables untouched (safety check)
        run: |
          echo "=== Verifying Wave-3/4/5A tables untouched ==="
          SAFETY_SQL='SELECT (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''Payment'\'' AND column_name = '\''status'\'') AS payment_status_col, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''Refund'\'' AND column_name = '\''status'\'') AS refund_status_col, (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''LedgerEntry'\'' AND column_name = '\''entryType'\'') AS ledger_entrytype_col, (SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '\''Outbox'\'') AS outbox_table, (SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '\''WebhookEvent'\'') AS webhook_table, (SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '\''IdempotencyKey'\'') AS idempotency_table, (SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '\''AuditLog'\'') AS audit_table;'
          RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$SAFETY_SQL" '{query: $q}')")
          echo "$RESULT" | jq '.' 2>/dev/null || echo "$RESULT"
          echo "=== Safety check complete (Wave-3/4/5A tables must be unchanged) ==="
