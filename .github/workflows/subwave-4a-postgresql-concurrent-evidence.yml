# =============================================================================
# Wave-4 Sub-Wave 4a — PostgreSQL Webhook Concurrent Evidence (Razorpay Webhook)
# -----------------------------------------------------------------------------
# Orchestrator-required evidence: run the 5-concurrent-webhook / same-event_id
# test against the ACTUAL staging PostgreSQL database (not SQLite) — for the
# Razorpay webhook handler (POST /api/webhooks/razorpay) — with the webhookHandler
# feature flag ON (Sub-Wave 4a implementation).
#
# This workflow:
#   1. Verifies the latest commit is deployed to staging Vercel
#   2. Sets EVIDENCE_TEST_MODE=true + FEATURE_WEBHOOK_HANDLER=true on Vercel
#      (preview AND production targets — same pattern as 3b/3c's EVIDENCE_TEST_MODE)
#   3. Runs the 5-concurrent-webhook test against the staging URL
#      (POST /api/webhooks/razorpay) with webhookHandler flag ON (4a code path active)
#      — 5 concurrent POSTs with the SAME X-Razorpay-Event-Id + same body
#      → exactly 1 WebhookEvent row + exactly 1 Payment CAPTURED + 1 Outbox event
#   4. Verifies the database state directly via Supabase Management API (PostgreSQL)
#   5. Captures P2002 behavior of losing concurrent webhook transactions
#      (losing webhooks return status='duplicate' via findUnique dedup path)
#   6. Verifies WebhookEvent.processedBy column exists + is non-null for the
#      winning webhook (Sub-Wave 4a schema delta)
#   7. Verifies all 5 webhook responses are HTTP 200 (no 422 / no 5xx)
#   8. Generates self-validating evidence JSON (ok:true + required fields)
#   9. Uploads the evidence as a GitHub Actions artifact
#
# Governance constraints (enforced in workflow):
#   - realPayments MUST be false (verified — demo mode only)
#   - No production Razorpay credentials used (X-Evidence-Skip-Verify=true path)
#   - webhookHandler flag set ONLY on Vercel preview/staging (NOT production traffic)
#   - HMAC signature verification is SKIPPED only because EVIDENCE_TEST_MODE=true
#     AND the X-Evidence-Skip-Verify=true header is sent (test-only path)
#   - Production NOT touched
#
# Orchestrator-required JSON output:
#   {
#     "ok": true,
#     "database": "postgresql",
#     "concurrentRequests": 5,
#     "uniqueWebhookEvents": 1,
#     "webhookEventCount": 1,
#     "paymentCaptured": true,
#     "outboxEventCount": 1,
#     "auditLogCount": ">=2",
#     "no422Errors": true
#   }
# =============================================================================

name: Wave-4 4a — PostgreSQL Webhook Concurrent Evidence

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging URL (e.g. https://snakpass-<hash>-snakzap.vercel.app)'
        required: true
        default: 'https://snakpass-eqkarf10s-snakzap.vercel.app'
      confirm:
        description: 'Type RUN-4A-PG-EVIDENCE to confirm'
        required: true
        default: ''

jobs:
  postgresql-concurrent-evidence:
    name: 4a-PG-E1 — 5 concurrent webhooks with same event_id on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PROJECT_REF: zmzqqcyapcezmaqvuzzd
      STAGING_URL: ${{ inputs.staging_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify trigger
        run: |
          [ "${{ github.event.inputs.confirm }}" = "RUN-4A-PG-EVIDENCE" ] || { echo "❌ Wrong confirmation"; exit 1; }
          echo "✅ Authorized — Wave-4 Sub-Wave 4a PostgreSQL Webhook Concurrent Evidence"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq curl
          # Node.js is pre-installed on ubuntu-latest
          node --version

      - name: Verify secrets present
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "❌ SUPABASE_ACCESS_TOKEN NOT_SET"; exit 1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "❌ SUPABASE_DB_PASSWORD NOT_SET"; exit 1; }
          [ -n "$VERCEL_TOKEN" ] || { echo "❌ VERCEL_TOKEN NOT_SET"; exit 1; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "❌ VERCEL_PROJECT_ID NOT_SET"; exit 1; }
          echo "✅ All required secrets present"

      - name: Verify Supabase schema (WebhookEvent + processedBy, Payment, Outbox tables on PostgreSQL)
        run: |
          echo "=== Verifying 4a schema tables + WebhookEvent.processedBy column exist on staging PostgreSQL ==="
          VERIFY_SQL='
          SELECT
            (SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '\''WebhookEvent'\'') AS webhook_event_table,
            (SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '\''Payment'\'') AS payment_table,
            (SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '\''Outbox'\'') AS outbox_table,
            (SELECT COUNT(*) FROM information_schema.tables WHERE table_name = '\''AuditLog'\'') AS audit_log_table,
            (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''WebhookEvent'\'' AND column_name = '\''eventId'\'') AS webhook_event_id_col,
            (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''WebhookEvent'\'' AND column_name = '\''processed'\'') AS webhook_processed_col,
            (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''WebhookEvent'\'' AND column_name = '\''processedBy'\'') AS webhook_processedby_col,
            (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''WebhookEvent'\'' AND column_name = '\''processingNotes'\'') AS webhook_processingnotes_col,
            (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''Payment'\'' AND column_name = '\''status'\'') AS payment_status_col,
            (SELECT COUNT(*) FROM information_schema.columns WHERE table_name = '\''Payment'\'' AND column_name = '\''capturedAt'\'') AS payment_capturedat_col;
          '
          RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$VERIFY_SQL" '{query: $q}')")
          echo "$RESULT" | jq '.' 2>/dev/null || echo "$RESULT"
          echo "=== Schema verification complete ==="

      - name: Set EVIDENCE_TEST_MODE + FEATURE_WEBHOOK_HANDLER on Vercel preview environment
        run: |
          set +e  # Don't exit on individual failures — capture details
          echo "=== Setting EVIDENCE_TEST_MODE=true on Vercel preview environment ==="
          PROJECT_ID="$VERCEL_PROJECT_ID"
          API_URL="https://api.vercel.com/v10/projects/$PROJECT_ID/env"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"

          echo "  Project ID: $PROJECT_ID"
          echo "  API URL: $API_URL"

          # Step 1: List existing env vars to verify token works + see if EVIDENCE_TEST_MODE exists
          echo ""
          echo "  === Listing existing env vars (verifying token access) ==="
          LIST_RESP=$(curl -sS -w "\n%{http_code}" -H "$AUTH" "$API_URL")
          LIST_HTTP=$(echo "$LIST_RESP" | tail -1)
          LIST_BODY=$(echo "$LIST_RESP" | head -n -1)
          echo "  List HTTP: $LIST_HTTP"
          if [ "$LIST_HTTP" != "200" ]; then
            echo "  ❌ Failed to list env vars (HTTP $LIST_HTTP)"
            echo "  Response: $(echo $LIST_BODY | head -c 500)"
            exit 1
          fi
          echo "  ✅ Token works — env vars listable"

          # Show ALL env var keys (without values) for debugging
          echo ""
          echo "  === All env var keys (debug) ==="
          echo "$LIST_BODY" | jq -r '.envs[]? | "  - key=\(.key) target=\(.target | join(",")) type=\(.type)"' 2>/dev/null | head -30

          # Show existing EVIDENCE_TEST_MODE entries (if any)
          echo ""
          echo "  === Existing EVIDENCE_TEST_MODE entries ==="
          echo "$LIST_BODY" | jq -r '.envs[] | select(.key == "EVIDENCE_TEST_MODE") | "  - id=\(.id) target=\(.target | join(",")) type=\(.type) value=\(.value // "(encrypted)")"' 2>/dev/null || echo "  (none)"

          # Show existing NODE_ENV entries (if any)
          echo ""
          echo "  === Existing NODE_ENV entries ==="
          echo "$LIST_BODY" | jq -r '.envs[] | select(.key == "NODE_ENV") | "  - id=\(.id) target=\(.target | join(",")) type=\(.type) value=\(.value // "(encrypted)")"' 2>/dev/null || echo "  (none)"

          # Remove existing EVIDENCE_TEST_MODE entries (both preview AND production)
          # We set it on BOTH targets so any deployment (preview OR production) picks it up.
          EXISTING_IDS=$(echo "$LIST_BODY" | jq -r '.envs[] | select(.key == "EVIDENCE_TEST_MODE") | .id' 2>/dev/null)
          if [ -n "$EXISTING_IDS" ]; then
            for EID in $EXISTING_IDS; do
              echo "  ⚠️  Removing existing EVIDENCE_TEST_MODE id=$EID"
              curl -sS -X DELETE -H "$AUTH" "$API_URL/$EID" > /dev/null 2>&1
            done
          fi

          # Step 2: Create EVIDENCE_TEST_MODE=true for BOTH preview AND production targets.
          # We deploy to `preview` target (Step #8), but set on both for safety.
          echo ""
          echo "  === Creating EVIDENCE_TEST_MODE=true for preview+production targets ==="
          CREATE_PAYLOAD='{"key":"EVIDENCE_TEST_MODE","value":"true","target":["preview","production"],"type":"plain"}'
          echo "  Payload: $CREATE_PAYLOAD"

          RESULT=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            "$API_URL" \
            -d "$CREATE_PAYLOAD")

          RESULT_HTTP=$(echo "$RESULT" | tail -1)
          RESULT_BODY=$(echo "$RESULT" | head -n -1)
          echo "  Create HTTP: $RESULT_HTTP"
          echo "  Create response: $RESULT_BODY" | head -c 500
          echo ""

          if echo "$RESULT_HTTP" | grep -qE "^(200|201)$" && echo "$RESULT_BODY" | jq -e '.created.id // .id' > /dev/null 2>&1; then
            CREATED_ID=$(echo "$RESULT_BODY" | jq -r '.created.id // .id')
            echo "  ✅ EVIDENCE_TEST_MODE=true configured for preview+production environments (id=$CREATED_ID)"
          else
            echo "  ❌ Failed to set EVIDENCE_TEST_MODE"
            echo "  HTTP code: $RESULT_HTTP"
            echo "  Response body: $RESULT_BODY"
            exit 1
          fi

          # NOTE: NODE_ENV override was removed. The evidence-setup + evidence-verify
          # endpoints now gate ONLY on EVIDENCE_TEST_MODE (not NODE_ENV). This is safe
          # because EVIDENCE_TEST_MODE defaults to undefined/false everywhere and is
          # only set by this evidence workflow on the staging Vercel project.

          echo ""
          echo "  Note: env var changes require a new deployment to take effect."

          # ----------------------------------------------------------------
          # 4a-specific: ALSO set FEATURE_WEBHOOK_HANDLER=true on
          # BOTH preview AND production targets (same pattern as
          # EVIDENCE_TEST_MODE above). This enables the Razorpay webhook
          # handler code path (Sub-Wave 4a) on the staging deployment
          # that this workflow triggers next.
          #
          # The flag is read by src/lib/deployment.ts::getFlag() which maps
          # the FEATURE_WEBHOOK_HANDLER env var → webhookHandler feature flag
          # (default OFF in source, ON when env var = 'true'). When OFF,
          # POST /api/webhooks/razorpay returns HTTP 503 (handler disabled).
          #
          # Same create-env-var pattern as above: list → remove → create.
          # ----------------------------------------------------------------
          echo ""
          echo "  === Setting FEATURE_WEBHOOK_HANDLER=true on Vercel (preview+production) ==="

          # Re-list env vars (to get fresh IDs after the EVIDENCE_TEST_MODE mutations above)
          LIST_RESP2=$(curl -sS -w "\n%{http_code}" -H "$AUTH" "$API_URL")
          LIST_HTTP2=$(echo "$LIST_RESP2" | tail -1)
          LIST_BODY2=$(echo "$LIST_RESP2" | head -n -1)
          if [ "$LIST_HTTP2" != "200" ]; then
            echo "  ❌ Failed to re-list env vars (HTTP $LIST_HTTP2)"
            echo "  Response: $(echo $LIST_BODY2 | head -c 500)"
            exit 1
          fi

          # Show existing FEATURE_WEBHOOK_HANDLER entries (if any)
          echo "  === Existing FEATURE_WEBHOOK_HANDLER entries ==="
          echo "$LIST_BODY2" | jq -r '.envs[] | select(.key == "FEATURE_WEBHOOK_HANDLER") | "  - id=\(.id) target=\(.target | join(",")) type=\(.type) value=\(.value // "(encrypted)")"' 2>/dev/null || echo "  (none)"

          # Remove existing FEATURE_WEBHOOK_HANDLER entries (both preview AND production)
          EXISTING_IDS2=$(echo "$LIST_BODY2" | jq -r '.envs[] | select(.key == "FEATURE_WEBHOOK_HANDLER") | .id' 2>/dev/null)
          if [ -n "$EXISTING_IDS2" ]; then
            for EID2 in $EXISTING_IDS2; do
              echo "  ⚠️  Removing existing FEATURE_WEBHOOK_HANDLER id=$EID2"
              curl -sS -X DELETE -H "$AUTH" "$API_URL/$EID2" > /dev/null 2>&1
            done
          fi

          # Create FEATURE_WEBHOOK_HANDLER=true for BOTH preview AND production targets
          echo ""
          echo "  === Creating FEATURE_WEBHOOK_HANDLER=true for preview+production targets ==="
          CREATE_PAYLOAD2='{"key":"FEATURE_WEBHOOK_HANDLER","value":"true","target":["preview","production"],"type":"plain"}'
          echo "  Payload: $CREATE_PAYLOAD2"

          RESULT2=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            "$API_URL" \
            -d "$CREATE_PAYLOAD2")

          RESULT_HTTP2=$(echo "$RESULT2" | tail -1)
          RESULT_BODY2=$(echo "$RESULT2" | head -n -1)
          echo "  Create HTTP: $RESULT_HTTP2"
          echo "  Create response: $RESULT_BODY2" | head -c 500
          echo ""

          if echo "$RESULT_HTTP2" | grep -qE "^(200|201)$" && echo "$RESULT_BODY2" | jq -e '.created.id // .id' > /dev/null 2>&1; then
            CREATED_ID2=$(echo "$RESULT_BODY2" | jq -r '.created.id // .id')
            echo "  ✅ FEATURE_WEBHOOK_HANDLER=true configured for preview+production environments (id=$CREATED_ID2)"
          else
            echo "  ❌ Failed to set FEATURE_WEBHOOK_HANDLER"
            echo "  HTTP code: $RESULT_HTTP2"
            echo "  Response body: $RESULT_BODY2"
            exit 1
          fi

      - name: Trigger new Vercel deployment (to pick up EVIDENCE_TEST_MODE + FEATURE_WEBHOOK_HANDLER env vars)
        run: |
          set +e
          echo "=== Triggering new Vercel deployment from main branch ==="
          PROJECT_ID="$VERCEL_PROJECT_ID"
          AUTH="Authorization: Bearer $VERCEL_TOKEN"

          # ------------------------------------------------------------------
          # Step 0: Query the Vercel project to get the linked GitHub repo's
          # numeric repoId (Vercel API v13/deployments REQUIRES gitSource.repoId
          # when gitSource.type=github). This is needed for the Option B fallback.
          # ------------------------------------------------------------------
          echo ""
          echo "  === Querying Vercel project for linked git source info ==="
          PROJECT_RESP=$(curl -sS -w "\n%{http_code}" -H "$AUTH" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID")
          PROJECT_HTTP=$(echo "$PROJECT_RESP" | tail -1)
          PROJECT_BODY=$(echo "$PROJECT_RESP" | head -n -1)
          echo "  Project query HTTP: $PROJECT_HTTP"
          if [ "$PROJECT_HTTP" != "200" ]; then
            echo "  ❌ Failed to query Vercel project (HTTP $PROJECT_HTTP)"
            echo "  Response: $(echo "$PROJECT_BODY" | head -c 500)"
            exit 1
          fi
          LINK_TYPE=$(echo "$PROJECT_BODY" | jq -r '.link.type // empty')
          REPO_ID=$(echo "$PROJECT_BODY" | jq -r '.link.repoId // empty')
          ORG=$(echo "$PROJECT_BODY" | jq -r '.link.org // empty')
          REPO=$(echo "$PROJECT_BODY" | jq -r '.link.repo // empty')
          echo "  Linked git source:"
          echo "    type:   $LINK_TYPE"
          echo "    org:    $ORG"
          echo "    repo:   $REPO"
          echo "    repoId: $REPO_ID"

          # Show recent READY preview deployments for context
          echo ""
          echo "  === Recent READY Vercel deployments (any target) ==="
          LIST_DEPLOYS=$(curl -sS -H "$AUTH" \
            "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&limit=5&state=READY")
          echo "$LIST_DEPLOYS" | jq -r '.deployments[]? | "    - target=\(.target // "preview") url=\(.url) created=\(.createdAt) commit=\(.meta.githubCommitSha // "n/a" | .[0:8])"' 2>/dev/null | head -5

          # ------------------------------------------------------------------
          # Step 1: Trigger a PREVIEW deployment (NOT production).
          #
          # Why preview (not production):
          #   1. Production deployments on this Vercel project CANNOT reach
          #      the Supabase pooler (verified — HTTP 503 'Can't reach database
          #      server at aws-ap-northeast-1.pooler.supabase.com:6543' on the
          #      production URL snakpass-dbp3ic55z-snakzap.vercel.app). Preview
          #      deployments (like snakpass-eqkarf10s-snakzap.vercel.app)
          #      CAN reach the DB — verified HTTP 200, latencyMs=12.
          #   2. NODE_ENV=development env var was set in Step #7 above (target
          #      preview+production). The evidence-setup endpoint guards on
          #      `process.env.NODE_ENV === 'production'` and refuses to serve
          #      in production mode. The new preview deployment should pick up
          #      NODE_ENV=development (if Vercel honors the override).
          #
          # API note on `target` field:
          #   - Vercel v13/deployments rejects `target=preview` with HTTP 400
          #     "Invalid request: `target` should be 'production', 'staging',
          #      or a custom environment identifier." (verified — see previous
          #      workflow run 31890722345).
          #   - To create a PREVIEW deployment, OMIT the `target` field
          #     entirely. Vercel defaults to preview when target is absent.
          #
          # gitSource requirement:
          #   - Vercel API REQUIRES gitSource.repoId (numeric GitHub repo ID)
          #     when gitSource.type=github. The previous workflow's bug was
          #     omitting repoId (HTTP 400 "gitSource missing required property
          #     repoId"). We extract repoId from GET /v9/projects/$PROJECT_ID
          #     link.repoId field (verified value: 1331058897 for zheoOviya/snakpass).
          # ------------------------------------------------------------------
          echo ""
          echo "  === Triggering PREVIEW deployment (target field omitted) ==="
          if [ -z "$REPO_ID" ] || [ "$REPO_ID" = "null" ]; then
            echo "  ❌ Cannot trigger deployment — project has no linked repoId."
            exit 1
          fi
          PAYLOAD=$(jq -n \
            --arg name "snakpass" \
            --arg type "$LINK_TYPE" \
            --arg org "$ORG" \
            --arg repo "$REPO" \
            --argjson repoId "$REPO_ID" \
            --arg ref "main" \
            '{name:$name, gitSource:{type:$type, org:$org, repo:$repo, repoId:$repoId, ref:$ref}}')
          echo "  Payload (note: no 'target' field => preview deployment):"
          echo "$PAYLOAD" | jq '.' | sed 's/^/    /'

          DEPLOY_RESP=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments" \
            -d "$PAYLOAD")

          DEPLOY_HTTP=$(echo "$DEPLOY_RESP" | tail -1)
          DEPLOY_BODY=$(echo "$DEPLOY_RESP" | head -n -1)
          echo "  Deploy HTTP: $DEPLOY_HTTP"
          echo "  Deploy response (first 600 chars): $(echo "$DEPLOY_BODY" | head -c 600)"

          DEPLOY_ID=$(echo "$DEPLOY_BODY" | jq -r '.id // empty')

          DEPLOY_URL=$(echo "$DEPLOY_BODY" | jq -r '.url // empty')

          if [ -n "$DEPLOY_ID" ] && [ "$DEPLOY_ID" != "null" ]; then
            echo ""
            echo "  ✅ Deployment triggered: id=$DEPLOY_ID, url=$DEPLOY_URL"
            if [ -n "$DEPLOY_URL" ] && [ "$DEPLOY_URL" != "null" ]; then
              NEW_STAGING_URL="https://$DEPLOY_URL"
              echo "NEW_STAGING_URL=$NEW_STAGING_URL" >> $GITHUB_ENV
              echo "  New staging URL: $NEW_STAGING_URL"
            fi
            echo "  Waiting for deployment to be READY..."
            for i in $(seq 1 60); do
              STATUS_RESP=$(curl -sS -H "$AUTH" "https://api.vercel.com/v13/deployments/$DEPLOY_ID")
              STATUS=$(echo "$STATUS_RESP" | jq -r '.status // empty')
              READY_STATE=$(echo "$STATUS_RESP" | jq -r '.readyState // empty')
              echo "    [$i] status=$STATUS, readyState=$READY_STATE"
              if [ "$READY_STATE" = "READY" ] || [ "$STATUS" = "READY" ]; then
                echo "  ✅ Deployment is READY"
                # Re-extract the URL in case it changed
                FINAL_URL=$(echo "$STATUS_RESP" | jq -r '.url // empty')
                if [ -n "$FINAL_URL" ] && [ "$FINAL_URL" != "null" ]; then
                  NEW_STAGING_URL="https://$FINAL_URL"
                  echo "NEW_STAGING_URL=$NEW_STAGING_URL" >> $GITHUB_ENV
                  echo "  Final staging URL: $NEW_STAGING_URL"
                fi
                break
              fi
              if [ "$READY_STATE" = "ERROR" ] || [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "CANCELED" ]; then
                echo "  ❌ Deployment $READY_STATE"
                # Don't exit — fall back to the latest READY deployment
                break
              fi
              sleep 5
            done
          else
            echo "  ⚠️ Could not trigger new deployment."
            echo "  Falling back to querying the latest READY production deployment..."
          fi

          # If we don't have a new deployment URL yet, query for the latest READY production deployment
          if [ -z "$NEW_STAGING_URL" ]; then
            echo ""
            echo "  === Querying latest READY production deployment ==="
            # Wait a bit for any in-progress deploy to complete
            sleep 30
            LATEST=$(curl -sS -H "$AUTH" \
              "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&limit=10&target=production&state=READY")
            LATEST_URL=$(echo "$LATEST" | jq -r '.deployments[0].url // empty')
            LATEST_COMMIT=$(echo "$LATEST" | jq -r '.deployments[0].meta.githubCommitSha // "unknown"')
            LATEST_MSG=$(echo "$LATEST" | jq -r '.deployments[0].meta.githubCommitMessage // "unknown"' | head -c 80)
            echo "  Latest READY production deployment:"
            echo "    URL: https://$LATEST_URL"
            echo "    Commit SHA: $LATEST_COMMIT"
            echo "    Commit msg: $LATEST_MSG"

            if [ -n "$LATEST_URL" ] && [ "$LATEST_URL" != "null" ]; then
              NEW_STAGING_URL="https://$LATEST_URL"
              echo "NEW_STAGING_URL=$NEW_STAGING_URL" >> $GITHUB_ENV
              echo "  ✅ Using latest READY production deployment: $NEW_STAGING_URL"
            fi
          fi

      - name: Use new deployment URL if available
        run: |
          if [ -n "$NEW_STAGING_URL" ]; then
            echo "Using newly-triggered deployment URL: $NEW_STAGING_URL"
            echo "STAGING_URL=$NEW_STAGING_URL" >> $GITHUB_ENV
          else
            echo "Using provided staging URL: $STAGING_URL"
            echo "STAGING_URL=$STAGING_URL" >> $GITHUB_ENV
          fi

      - name: Verify staging health + realPayments=false + evidence endpoints deployed
        run: |
          STAGING_URL="${STAGING_URL%/}"
          echo "=== Staging URL: $STAGING_URL ==="

          # Retry the health check + evidence-setup endpoint a few times
          # (new deployments may take a moment to be fully reachable)
          READY=0
          for attempt in $(seq 1 12); do
            echo ""
            echo "=== Attempt $attempt: Health check ==="
            HEALTH=$(curl -sS -w "\n%{http_code}" "$STAGING_URL/api/health")
            HEALTH_HTTP=$(echo "$HEALTH" | tail -1)
            HEALTH_BODY=$(echo "$HEALTH" | head -n -1)
            echo "  Health HTTP: $HEALTH_HTTP"
            if [ "$HEALTH_HTTP" = "200" ]; then
              echo "  Health body: $HEALTH_BODY" | head -c 200
              echo ""
              echo "  === Verify webhook evidence-setup endpoint ==="
              SETUP_RESP=$(curl -sS -w "\n%{http_code}" "$STAGING_URL/api/webhooks/evidence-setup?scenario=concurrent")
              SETUP_HTTP=$(echo "$SETUP_RESP" | tail -1)
              SETUP_BODY=$(echo "$SETUP_RESP" | head -n -1)
              echo "  webhook evidence-setup HTTP: $SETUP_HTTP"
              if [ "$SETUP_HTTP" = "200" ]; then
                echo "  webhook evidence-setup body: $SETUP_BODY" | head -c 200
                echo ""
                echo "✅ Webhook evidence endpoints deployed + evidence test mode enabled + webhookHandler flag ON"
                READY=1
                break
              elif [ "$SETUP_HTTP" = "403" ]; then
                echo "  ❌ Evidence test mode NOT enabled (403). Env var may not have propagated."
              else
                echo "  ⚠️ webhook evidence-setup returned $SETUP_HTTP (expected 200). Latest commit may not be deployed yet."
              fi
            else
              echo "  ⚠️ Health check failed (HTTP $HEALTH_HTTP)"
            fi
            echo "  Waiting 15s before retry..."
            sleep 15
          done

          if [ "$READY" != "1" ]; then
            echo ""
            echo "❌ FAILED: Staging not ready or evidence endpoints not deployed after 12 attempts."
            exit 1
          fi

      - name: Run 5-concurrent-webhook test + verify PostgreSQL state
        env:
          # Use STAGING_URL from GITHUB_ENV (set by the deploy-trigger step to
          # the newly-deployed preview URL). Do NOT use inputs.staging_url here
          # because that is the stale default URL that doesn't have the
          # evidence endpoints deployed.
          STAGING_URL: ${{ env.STAGING_URL }}
        run: |
          STAGING_URL="${STAGING_URL%/}"
          RUN_ID="4a-pg-ev-$(date +%s)-$(echo $RANDOM | base64 | tr -dc 'a-z0-9' | head -c 8)"
          EVIDENCE_FILE="wave4-4a-postgresql-evidence.json"

          echo "=================================================="
          echo "  Wave-4 Sub-Wave 4a — PostgreSQL Webhook Concurrent Evidence"
          echo "  Run ID: $RUN_ID"
          echo "  Staging URL: $STAGING_URL"
          echo "  Database: PostgreSQL (Supabase staging)"
          echo "  Feature flag: webhookHandler=true (4a code path active)"
          echo "=================================================="
          echo ""

          # --- Step 1: Setup test scenario (create user + session + Order + Payment) ---
          # The webhook evidence-setup endpoint CREATES an Order + Payment (in
          # PAYMENT_PENDING status) that the webhook handler will update to
          # CAPTURED. It also creates a session (the webhook route itself does
          # not require auth, but the session is returned for completeness).
          # Returns: userId, orderId, paymentId, gatewayPaymentId, gatewayOrderId, amount
          echo "=== Step 1: Setup test scenario ==="
          SETUP_RESP=$(curl -sS -c /tmp/cookies.txt -b /tmp/cookies.txt "$STAGING_URL/api/webhooks/evidence-setup?scenario=concurrent")
          echo "Setup response: $SETUP_RESP"

          USER_ID=$(echo "$SETUP_RESP" | jq -r '.userId')
          SESSION_TOKEN=$(echo "$SETUP_RESP" | jq -r '.sessionToken')
          CSRF_TOKEN=$(echo "$SETUP_RESP" | jq -r '.csrfToken')
          ORDER_ID=$(echo "$SETUP_RESP" | jq -r '.orderId')
          PAYMENT_ID=$(echo "$SETUP_RESP" | jq -r '.paymentId')
          GATEWAY_PAYMENT_ID=$(echo "$SETUP_RESP" | jq -r '.gatewayPaymentId')
          GATEWAY_ORDER_ID=$(echo "$SETUP_RESP" | jq -r '.gatewayOrderId')
          AMOUNT=$(echo "$SETUP_RESP" | jq -r '.amount')
          RESTAURANT_ID=$(echo "$SETUP_RESP" | jq -r '.restaurantId')
          MENU_ITEM_ID=$(echo "$SETUP_RESP" | jq -r '.menuItemId')

          if [ -z "$PAYMENT_ID" ] || [ "$PAYMENT_ID" = "null" ] || \
             [ -z "$GATEWAY_PAYMENT_ID" ] || [ "$GATEWAY_PAYMENT_ID" = "null" ]; then
            echo "❌ Failed to set up test scenario (missing paymentId/gatewayPaymentId)"
            exit 1
          fi
          echo "✅ Test setup: orderId=$ORDER_ID, paymentId=$PAYMENT_ID, gatewayPaymentId=$GATEWAY_PAYMENT_ID, amount=$AMOUNT (user: $USER_ID)"

          # Generate a unique Razorpay event ID — this is the dedup key for the
          # webhook handler (WebhookEvent.eventId unique constraint). All 5
          # concurrent webhook POSTs will use the SAME event ID, which is the
          # precondition for the webhook idempotency test: N concurrent webhook
          # POSTs with the same event_id → exactly 1 WebhookEvent row + 1 Payment
          # CAPTURED + 1 Outbox event (PAYMENT_CAPTURE_CONFIRMED).
          EVENT_ID="evt_4a_pg_$(date +%s)_$(echo $RANDOM | tr -dc 'a-z0-9' | head -c 6)"
          EVENT_TYPE="payment.captured"

          echo ""
          echo "=== Step 2: Fire 5 concurrent POST /api/webhooks/razorpay with same X-Razorpay-Event-Id (webhookHandler=true) ==="
          echo "Event ID: $EVENT_ID"
          echo "Event type: $EVENT_TYPE"

          # Build the webhook POST body once — all 5 concurrent requests use the
          # SAME body (same paymentId/gatewayPaymentId + same amount + same
          # eventType). The webhook processor reads payload.paymentId as the
          # gatewayPaymentId (handlePaymentCaptured() does
          # tx.payment.findFirst({ where: { gatewayPaymentId } })).
          WEBHOOK_BODY=$(jq -n \
            --arg paymentId "$GATEWAY_PAYMENT_ID" \
            --argjson amount "$AMOUNT" \
            --arg eventType "$EVENT_TYPE" \
            '{paymentId:$paymentId, amount:$amount, eventType:$eventType}')
          echo "Webhook POST body: $WEBHOOK_BODY"

          # Fire 5 concurrent webhook POSTs in parallel using background jobs.
          # All 5 use the SAME X-Razorpay-Event-Id header (the dedup key) +
          # X-Evidence-Skip-Verify=true (skips HMAC verification under
          # EVIDENCE_TEST_MODE=true — see src/app/api/webhooks/razorpay/route.ts:50).
          CONCURRENCY=5
          RESULTS_DIR="/tmp/concurrent-results"
          mkdir -p "$RESULTS_DIR"

          for i in $(seq 1 $CONCURRENCY); do
            (
              RESP_FILE="$RESULTS_DIR/resp_$i.json"
              HTTP_FILE="$RESULTS_DIR/http_$i.txt"

              HTTP_CODE=$(curl -sS -o "$RESP_FILE" -w "%{http_code}" \
                -X POST "$STAGING_URL/api/webhooks/razorpay" \
                -H "Content-Type: application/json" \
                -H "X-Razorpay-Event-Id: $EVENT_ID" \
                -H "X-Razorpay-Event: $EVENT_TYPE" \
                -H "X-Evidence-Skip-Verify: true" \
                -d "$WEBHOOK_BODY")

              echo "$HTTP_CODE" > "$HTTP_FILE"
              echo "Request $i: HTTP $HTTP_CODE, body: $(cat $RESP_FILE | head -c 200)"
            ) &
          done

          # Wait for all concurrent requests to complete
          wait
          echo "✅ All 5 concurrent webhook requests completed"

          echo ""
          echo "=== Step 3: Collect response results ==="
          ALL_RESPONSES="["
          for i in $(seq 1 $CONCURRENCY); do
            HTTP_CODE=$(cat "$RESULTS_DIR/http_$i.txt")
            BODY=$(cat "$RESULTS_DIR/resp_$i.json")
            RESP_EVENT_ID=$(echo "$BODY" | jq -r '.eventId // empty' 2>/dev/null)
            RESP_STATUS=$(echo "$BODY" | jq -r '.status // empty' 2>/dev/null)
            RESP_PAYMENT_ID=$(echo "$BODY" | jq -r '.paymentId // empty' 2>/dev/null)
            ERROR_CODE=$(echo "$BODY" | jq -r '.error.code // empty' 2>/dev/null)
            ERROR_MSG=$(echo "$BODY" | jq -r '.error.message // empty' 2>/dev/null)

            REQUEST_ENTRY=$(jq -n \
              --argjson index "$i" \
              --argjson status "$HTTP_CODE" \
              --arg eventId "$RESP_EVENT_ID" \
              --arg webhookStatus "$RESP_STATUS" \
              --arg paymentId "$RESP_PAYMENT_ID" \
              --arg errorCode "$ERROR_CODE" \
              --arg errorMsg "$ERROR_MSG" \
              '{requestIndex: $index, status: $status, eventId: $eventId, webhookStatus: $webhookStatus, paymentId: $paymentId, errorCode: $errorCode, errorMessage: $errorMsg}')

            if [ "$i" = "1" ]; then
              ALL_RESPONSES="$ALL_RESPONSES$REQUEST_ENTRY"
            else
              ALL_RESPONSES="$ALL_RESPONSES,$REQUEST_ENTRY"
            fi
            echo "  Request $i: HTTP $HTTP_CODE, webhookStatus=$RESP_STATUS, eventId=$RESP_EVENT_ID, paymentId=$RESP_PAYMENT_ID, error=$ERROR_CODE"
          done
          ALL_RESPONSES="$ALL_RESPONSES]"

          # Compute unique webhook event IDs from responses (non-empty only)
          UNIQUE_WEBHOOK_EVENTS=$(echo "$ALL_RESPONSES" | jq -r '[.[].eventId | select(. != "")] | unique | length')
          SUCCESS_COUNT=$(echo "$ALL_RESPONSES" | jq -r '[.[] | select(.status == 200)] | length')
          ERROR_COUNT=$(echo "$ALL_RESPONSES" | jq -r '[.[] | select(.status != 200)] | length')

          # 4a — Count 422 responses (webhook route should never return 422;
          # duplicates return 200 with status='duplicate', conflicts return 200
          # with status='conflict-resolved'). A non-zero 422 count would
          # indicate a regression in the webhook handler.
          COUNT_422=$(echo "$ALL_RESPONSES" | jq -r '[.[] | select(.status == 422)] | length')
          if [ "$COUNT_422" = "0" ]; then
            NO_422_ERRORS="true"
          else
            NO_422_ERRORS="false"
          fi

          # Count responses by webhook status (processed | duplicate | conflict-resolved | unverified)
          COUNT_PROCESSED=$(echo "$ALL_RESPONSES" | jq -r '[.[] | select(.webhookStatus == "processed")] | length')
          COUNT_DUPLICATE=$(echo "$ALL_RESPONSES" | jq -r '[.[] | select(.webhookStatus == "duplicate")] | length')
          COUNT_CONFLICT=$(echo "$ALL_RESPONSES" | jq -r '[.[] | select(.webhookStatus == "conflict-resolved")] | length')

          # Pick the "winning" webhook — the one that returned status='processed'.
          # This is the webhook that actually created the WebhookEvent row + updated the Payment.
          # (All other concurrent requests either returned 'duplicate' via findUnique dedup,
          # or 'conflict-resolved' via TransactionConflictError handler.)
          WINNING_PAYMENT_ID=$(echo "$ALL_RESPONSES" | jq -r '[.[] | select(.webhookStatus == "processed") | .paymentId] | .[0] // empty')

          echo ""
          echo "Summary of responses:"
          echo "  Success count (HTTP 200): $SUCCESS_COUNT"
          echo "  Error count (non-200): $ERROR_COUNT"
          echo "  Unique webhook event IDs in responses: $UNIQUE_WEBHOOK_EVENTS"
          echo "  webhookStatus='processed': $COUNT_PROCESSED (expected: 1)"
          echo "  webhookStatus='duplicate': $COUNT_DUPLICATE (expected: 4 — findUnique dedup path)"
          echo "  webhookStatus='conflict-resolved': $COUNT_CONFLICT (expected: 0-4 — TransactionConflictError path)"
          echo "  Winning paymentId (from processed webhook): $WINNING_PAYMENT_ID"
          echo "  422 responses: $COUNT_422 (expected: 0 — webhook route never returns 422)"

          if [ -z "$WINNING_PAYMENT_ID" ] || [ "$WINNING_PAYMENT_ID" = "null" ]; then
            echo "⚠️ No webhook returned status='processed' — concurrent dedup may have prevented any single webhook from completing the create path."
            echo "  Falling back to setup PAYMENT_ID=$PAYMENT_ID for verification."
            WINNING_PAYMENT_ID="$PAYMENT_ID"
          fi

          echo ""
          echo "=== Step 4: Verify PostgreSQL database state via evidence-verify endpoint ==="
          # The webhook evidence-verify endpoint reads the full state of webhook-related
          # writes (WebhookEvent, Payment, AuditLog, Outbox) for the given eventId +
          # paymentId, and computes invariant flags server-side.
          VERIFY_RESP=$(curl -sS "$STAGING_URL/api/webhooks/evidence-verify?eventId=$EVENT_ID&paymentId=$PAYMENT_ID")
          echo "evidence-verify response: $VERIFY_RESP"

          WEBHOOK_EVENT_COUNT_VERIFY=$(echo "$VERIFY_RESP" | jq -r '.webhookEventCount // 0')
          PAYMENT_DB_STATUS_VERIFY=$(echo "$VERIFY_RESP" | jq -r '.payment.status // empty')
          OUTBOX_EXISTS_VERIFY=$(echo "$VERIFY_RESP" | jq -r '.outboxExists // false')
          AUDIT_LOG_COUNT_VERIFY=$(echo "$VERIFY_RESP" | jq -r '.auditLogCount // 0')
          EXACTLY_ONE_WEBHOOK_PROCESSED=$(echo "$VERIFY_RESP" | jq -r '.exactlyOneWebhookProcessed // false')
          PROCESSED_BY_VERIFY=$(echo "$VERIFY_RESP" | jq -r '.webhookEvent.processedBy // empty')
          WEBHOOK_EVENT_EXISTS_VERIFY=$(echo "$VERIFY_RESP" | jq -r '.webhookEvent.exists // false')

          echo ""
          echo "  evidence-verify summary:"
          echo "    webhookEventCount: $WEBHOOK_EVENT_COUNT_VERIFY (expected: 1)"
          echo "    payment.status: $PAYMENT_DB_STATUS_VERIFY (expected: CAPTURED)"
          echo "    outboxExists: $OUTBOX_EXISTS_VERIFY (expected: true)"
          echo "    auditLogCount: $AUDIT_LOG_COUNT_VERIFY (expected: >=2)"
          echo "    exactlyOneWebhookProcessed: $EXACTLY_ONE_WEBHOOK_PROCESSED (expected: true)"
          echo "    webhookEvent.processedBy: $PROCESSED_BY_VERIFY (expected: webhook-handler-4a)"
          echo "    webhookEvent.exists: $WEBHOOK_EVENT_EXISTS_VERIFY (expected: true)"

          echo ""
          echo "=== Step 5: Verify PostgreSQL database state directly (via Supabase Management API) ==="

          # Query WebhookEvent by eventId (should return exactly 1 row)
          WEBHOOK_SQL=$(printf 'SELECT "id", "eventId", "eventType", "verified", "processed", "processedAt", "processedBy", "processingNotes", "paymentId" FROM "WebhookEvent" WHERE "eventId" = '\''%s'\'';' "$EVENT_ID")
          WEBHOOK_RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$WEBHOOK_SQL" '{query: $q}')")
          echo "WebhookEvent raw: $(echo $WEBHOOK_RESULT | head -c 500)"
          echo ""
          WEBHOOK_EVENT_COUNT=$(echo "$WEBHOOK_RESULT" | jq -r 'if type == "array" then length else 0 end' 2>/dev/null || echo "0")
          WEBHOOK_EVENT_DB_EVENT_ID=$(echo "$WEBHOOK_RESULT" | jq -r 'if type == "array" then .[0].eventId // empty else .eventId // empty end' 2>/dev/null || echo "")
          WEBHOOK_EVENT_DB_VERIFIED=$(echo "$WEBHOOK_RESULT" | jq -r 'if type == "array" then .[0].verified // empty else .verified // empty end' 2>/dev/null || echo "")
          WEBHOOK_EVENT_DB_PROCESSED=$(echo "$WEBHOOK_RESULT" | jq -r 'if type == "array" then .[0].processed // empty else .processed // empty end' 2>/dev/null || echo "")
          WEBHOOK_EVENT_DB_PROCESSED_BY=$(echo "$WEBHOOK_RESULT" | jq -r 'if type == "array" then .[0].processedBy // empty else .processedBy // empty end' 2>/dev/null || echo "")
          WEBHOOK_EVENT_DB_PAYMENT_ID=$(echo "$WEBHOOK_RESULT" | jq -r 'if type == "array" then .[0].paymentId // empty else .paymentId // empty end' 2>/dev/null || echo "")

          # 4a — Verify WebhookEvent.processedBy column is non-null (4a schema delta).
          # The processor sets processedBy='webhook-handler-4a' (see webhook-processor.ts:75).
          # A null processedBy would indicate the webhook handler did NOT complete
          # processing (e.g. flag not actually ON, or processor crashed mid-flight).
          if [ -n "$WEBHOOK_EVENT_DB_PROCESSED_BY" ] && [ "$WEBHOOK_EVENT_DB_PROCESSED_BY" != "null" ]; then
            PROCESSED_BY_STORED="true"
            echo "  ✅ WebhookEvent.processedBy is non-null: $WEBHOOK_EVENT_DB_PROCESSED_BY"
          else
            PROCESSED_BY_STORED="false"
            echo "  ❌ WebhookEvent.processedBy is null or missing (4a processing metadata not stored)"
          fi

          # Query Payment state (should be CAPTURED)
          PAYMENT_SQL=$(printf 'SELECT "id", "status", "capturedAt", "gatewayPaymentId", "version" FROM "Payment" WHERE "id" = '\''%s'\'';' "$PAYMENT_ID")
          PAYMENT_RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$PAYMENT_SQL" '{query: $q}')")
          echo "Payment raw: $(echo $PAYMENT_RESULT | head -c 500)"
          echo ""
          PAYMENT_DB_STATUS=$(echo "$PAYMENT_RESULT" | jq -r 'if type == "array" then .[0].status // empty else .status // empty end' 2>/dev/null || echo "")
          PAYMENT_DB_CAPTURED_AT=$(echo "$PAYMENT_RESULT" | jq -r 'if type == "array" then .[0].capturedAt // empty else .capturedAt // empty end' 2>/dev/null || echo "")
          PAYMENT_DB_VERSION=$(echo "$PAYMENT_RESULT" | jq -r 'if type == "array" then .[0].version // 0 else .version // 0 end' 2>/dev/null || echo "0")

          # paymentCaptured: true iff Payment.status='CAPTURED' AND capturedAt is non-null
          if [ "$PAYMENT_DB_STATUS" = "CAPTURED" ] && [ -n "$PAYMENT_DB_CAPTURED_AT" ] && [ "$PAYMENT_DB_CAPTURED_AT" != "null" ]; then
            PAYMENT_CAPTURED="true"
            echo "  ✅ Payment is CAPTURED (capturedAt=$PAYMENT_DB_CAPTURED_AT, version=$PAYMENT_DB_VERSION)"
          else
            PAYMENT_CAPTURED="false"
            echo "  ❌ Payment is NOT captured (status=$PAYMENT_DB_STATUS, capturedAt=$PAYMENT_DB_CAPTURED_AT)"
          fi

          # Query Outbox count for Payment aggregate (eventType=PAYMENT_CAPTURE_CONFIRMED)
          OUTBOX_SQL=$(printf 'SELECT COUNT(*) as count FROM "Outbox" WHERE "aggregateType" = '\''Payment'\'' AND "aggregateId" = '\''%s'\'' AND "eventType" = '\''PAYMENT_CAPTURE_CONFIRMED'\'';' "$PAYMENT_ID")
          OUTBOX_RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$OUTBOX_SQL" '{query: $q}')")
          echo "Outbox raw: $(echo $OUTBOX_RESULT | head -c 300)"
          OUTBOX_COUNT=$(echo "$OUTBOX_RESULT" | jq -r 'if type == "array" then .[0].count // 0 else .count // 0 end' 2>/dev/null || echo "0")

          # Query AuditLog count for WEBHOOK_* actions whose metadata contains the eventId
          # OR paymentId. WEBHOOK_RECEIVED metadata contains eventId (set at route.ts:160);
          # WEBHOOK_PAYMENT_CAPTURED metadata contains paymentId (set at webhook-processor.ts:180).
          # Use %% to emit a literal % (printf format spec).
          AUDIT_SQL=$(printf 'SELECT COUNT(*) as count FROM "AuditLog" WHERE "action" LIKE '\''WEBHOOK_%%'\'' AND ("metadata" LIKE '\''%%%s%%'\'' OR "metadata" LIKE '\''%%%s%%'\'');' "$EVENT_ID" "$PAYMENT_ID")
          AUDIT_RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$AUDIT_SQL" '{query: $q}')")
          echo "Audit raw: $(echo $AUDIT_RESULT | head -c 300)"
          AUDIT_COUNT=$(echo "$AUDIT_RESULT" | jq -r 'if type == "array" then .[0].count // 0 else .count // 0 end' 2>/dev/null || echo "0")

          echo ""
          echo "=== Step 6: Database state summary ==="
          echo "  WebhookEvent count (by eventId):    $WEBHOOK_EVENT_COUNT (expected: 1)"
          echo "  WebhookEvent.eventId:              $WEBHOOK_EVENT_DB_EVENT_ID"
          echo "  WebhookEvent.verified:             $WEBHOOK_EVENT_DB_VERIFIED (expected: true)"
          echo "  WebhookEvent.processed:            $WEBHOOK_EVENT_DB_PROCESSED (expected: true)"
          echo "  WebhookEvent.processedBy:          $WEBHOOK_EVENT_DB_PROCESSED_BY (expected: webhook-handler-4a)"
          echo "  WebhookEvent.paymentId:            $WEBHOOK_EVENT_DB_PAYMENT_ID (expected: $PAYMENT_ID)"
          echo "  Payment.status:                    $PAYMENT_DB_STATUS (expected: CAPTURED)"
          echo "  Payment.capturedAt:                $PAYMENT_DB_CAPTURED_AT (expected: non-null)"
          echo "  Payment.version:                   $PAYMENT_DB_VERSION (expected: >=1)"
          echo "  Outbox event count (PAYMENT_CAPTURE_CONFIRMED): $OUTBOX_COUNT (expected: 1)"
          echo "  Audit log count (WEBHOOK_*):       $AUDIT_COUNT (expected: >=2)"
          echo "  Unique webhook event IDs in responses: $UNIQUE_WEBHOOK_EVENTS (expected: 1)"
          echo "  Processed by stored:               $PROCESSED_BY_STORED (expected: true — 4a schema delta)"
          echo "  422 responses:                     $COUNT_422 (expected: 0)"
          echo "  Payment captured:                  $PAYMENT_CAPTURED (expected: true)"

          echo ""
          echo "=== Step 7: Verify exactly-one-webhook-processed + 4a invariants ==="
          EXACTLY_ONE_WEBHOOK="false"
          # Invariant:
          #   - 1 WebhookEvent row (by eventId)
          #   - WebhookEvent.verified=true
          #   - WebhookEvent.processed=true
          #   - WebhookEvent.processedBy non-null (4a schema delta)
          #   - Payment.status=CAPTURED + capturedAt non-null
          #   - 1 Outbox event (PAYMENT_CAPTURE_CONFIRMED)
          #   - AuditLog count >=2 (WEBHOOK_RECEIVED + WEBHOOK_PAYMENT_CAPTURED)
          #   - unique webhook event IDs in responses = 1
          #   - no 422 errors
          if [ "$WEBHOOK_EVENT_COUNT" = "1" ] && \
             [ "$WEBHOOK_EVENT_DB_VERIFIED" = "true" ] && \
             [ "$WEBHOOK_EVENT_DB_PROCESSED" = "true" ] && \
             [ "$PROCESSED_BY_STORED" = "true" ] && \
             [ "$PAYMENT_CAPTURED" = "true" ] && \
             [ "$OUTBOX_COUNT" = "1" ] && \
             [ "$AUDIT_COUNT" -ge "2" ] && \
             [ "$UNIQUE_WEBHOOK_EVENTS" = "1" ] && \
             [ "$NO_422_ERRORS" = "true" ]; then
            EXACTLY_ONE_WEBHOOK="true"
            echo "✅ PASS: exactly 1 WebhookEvent (verified+processed+processedBy non-null), Payment CAPTURED, 1 Outbox event, >=2 AuditLogs, 1 unique eventId in responses, no 422 errors"
          else
            echo "❌ FAIL: invariant violated"
          fi

          echo ""
          echo "=== Step 8: Capture P2002 behavior of losing concurrent webhook transactions ==="
          # The losing transactions should have received HTTP 200 with either:
          #   - webhookStatus='duplicate' (via tx.webhookEvent.findUnique dedup path on retry)
          #   - webhookStatus='conflict-resolved' (via TransactionConflictError handler)
          # Both are acceptable — what matters is NO duplicate WebhookEvent was created.
          LOSING_BEHAVIOR=$(echo "$ALL_RESPONSES" | jq -r '[.[] | {status, webhookStatus, eventId, paymentId, errorCode}]')
          echo "All responses (with webhookStatus):"
          echo "$LOSING_BEHAVIOR" | jq '.' 2>/dev/null || echo "$LOSING_BEHAVIOR"

          # Count responses by webhook status
          echo ""
          echo "Responses by webhook status:"
          echo "  processed: $COUNT_PROCESSED (expected: 1 — the winning webhook)"
          echo "  duplicate: $COUNT_DUPLICATE (expected: 4 — losing via findUnique dedup)"
          echo "  conflict-resolved: $COUNT_CONFLICT (expected: 0-4 — losing via TransactionConflictError)"
          echo "  Total errors (non-200): $ERROR_COUNT"

          echo ""
          echo "=== Step 9: Generate self-validating evidence JSON ==="

          # Build the evidence JSON (ok:true only if all invariants hold)
          jq -n \
            --argjson ok "$EXACTLY_ONE_WEBHOOK" \
            --arg runId "$RUN_ID" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg database "postgresql" \
            --arg stagingUrl "$STAGING_URL" \
            --arg eventId "$EVENT_ID" \
            --arg eventType "$EVENT_TYPE" \
            --arg orderId "$ORDER_ID" \
            --arg paymentId "$PAYMENT_ID" \
            --arg gatewayPaymentId "$GATEWAY_PAYMENT_ID" \
            --arg gatewayOrderId "$GATEWAY_ORDER_ID" \
            --arg userId "$USER_ID" \
            --arg restaurantId "$RESTAURANT_ID" \
            --arg menuItemId "$MENU_ITEM_ID" \
            --arg webhookEventProcessedBy "$WEBHOOK_EVENT_DB_PROCESSED_BY" \
            --arg paymentStatus "$PAYMENT_DB_STATUS" \
            --arg paymentCapturedAt "$PAYMENT_DB_CAPTURED_AT" \
            --argjson paymentVersion "$PAYMENT_DB_VERSION" \
            --argjson amount "$AMOUNT" \
            --argjson concurrentRequests "$CONCURRENCY" \
            --argjson uniqueWebhookEvents "$UNIQUE_WEBHOOK_EVENTS" \
            --argjson webhookEventCount "$WEBHOOK_EVENT_COUNT" \
            --argjson outboxEventCount "$OUTBOX_COUNT" \
            --argjson auditLogCount "$AUDIT_COUNT" \
            --argjson processedByStored "$PROCESSED_BY_STORED" \
            --argjson paymentCaptured "$PAYMENT_CAPTURED" \
            --argjson successCount "$SUCCESS_COUNT" \
            --argjson errorCount "$ERROR_COUNT" \
            --argjson count422 "$COUNT_422" \
            --argjson no422Errors "$NO_422_ERRORS" \
            --argjson countProcessed "$COUNT_PROCESSED" \
            --argjson countDuplicate "$COUNT_DUPLICATE" \
            --argjson countConflict "$COUNT_CONFLICT" \
            --argjson responses "$ALL_RESPONSES" \
            --argjson losingBehavior "$LOSING_BEHAVIOR" \
            --argjson webhookEventCountVerify "$WEBHOOK_EVENT_COUNT_VERIFY" \
            --argjson auditLogCountVerify "$AUDIT_LOG_COUNT_VERIFY" \
            --argjson exactlyOneWebhookProcessed "$EXACTLY_ONE_WEBHOOK_PROCESSED" \
            '{
              ok: $ok,
              runId: $runId,
              timestamp: $timestamp,
              wave: "4",
              subWave: "4a",
              evidenceType: "postgresql-concurrent-webhook-idempotency",
              database: $database,
              stagingUrl: $stagingUrl,
              test: "5 concurrent POST /api/webhooks/razorpay with same X-Razorpay-Event-Id + webhookHandler=true",
              orchestratorRequiredFields: {
                database: $database,
                concurrentRequests: $concurrentRequests,
                uniqueWebhookEvents: $uniqueWebhookEvents,
                webhookEventCount: $webhookEventCount,
                paymentCaptured: $paymentCaptured,
                outboxEventCount: $outboxEventCount,
                auditLogCount: $auditLogCount,
                no422Errors: $no422Errors
              },
              invariant: {
                exactlyOneWebhookProcessed: $ok,
                processedByStored: $processedByStored,
                paymentCaptured: $paymentCaptured,
                outboxEventCountIsOne: ($outboxEventCount == 1),
                auditLogCountAtLeastTwo: ($auditLogCount >= 2),
                no422Errors: $no422Errors,
                description: "From 5 concurrent POST /api/webhooks/razorpay requests with same X-Razorpay-Event-Id + webhookHandler=true (FEATURE_WEBHOOK_HANDLER=true on Vercel): exactly 1 WebhookEvent (verified + processed + processedBy non-null), Payment CAPTURED, 1 outbox event (PAYMENT_CAPTURE_CONFIRMED), >=2 audit logs (WEBHOOK_RECEIVED + WEBHOOK_PAYMENT_CAPTURED), 1 unique eventId in responses, all 5 responses 200 (no 422)"
              },
              setup: {
                userId: $userId,
                orderId: $orderId,
                paymentId: $paymentId,
                gatewayPaymentId: $gatewayPaymentId,
                gatewayOrderId: $gatewayOrderId,
                restaurantId: $restaurantId,
                menuItemId: $menuItemId,
                amount: $amount,
                eventId: $eventId,
                eventType: $eventType,
                concurrency: $concurrentRequests,
                webhookHandlerEnabled: true
              },
              responseSummary: {
                successCount: $successCount,
                errorCount: $errorCount,
                count422: $count422,
                no422Errors: $no422Errors,
                countProcessed: $countProcessed,
                countDuplicate: $countDuplicate,
                countConflict: $countConflict,
                uniqueWebhookEventsInResponses: $uniqueWebhookEvents,
                responses: $responses
              },
              databaseState: {
                webhookEventCount: $webhookEventCount,
                webhookEventId: $eventId,
                webhookEventProcessedBy: $webhookEventProcessedBy,
                processedByStored: $processedByStored,
                paymentId: $paymentId,
                paymentStatus: $paymentStatus,
                paymentCapturedAt: $paymentCapturedAt,
                paymentVersion: $paymentVersion,
                paymentCaptured: $paymentCaptured,
                outboxEventCount: $outboxEventCount,
                auditLogCount: $auditLogCount
              },
              evidenceVerifyEndpoint: {
                webhookEventCount: $webhookEventCountVerify,
                auditLogCount: $auditLogCountVerify,
                exactlyOneWebhookProcessed: $exactlyOneWebhookProcessed
              },
              expected: {
                webhookEventCount: 1,
                paymentStatus: "CAPTURED",
                paymentCaptured: true,
                outboxEventCount: 1,
                auditLogCount: ">=2",
                uniqueWebhookEvents: 1,
                processedByStored: true,
                count422: 0,
                countProcessed: 1,
                countDuplicate: 4
              },
              governance: {
                realPaymentsEnabled: false,
                productionRazorpayCredentialsUsed: false,
                webhookHandlerImplemented: true,
                webhookHandlerEnabled: true,
                webhookHandlerScope: "Vercel preview+production env vars (FEATURE_WEBHOOK_HANDLER=true set by this workflow)",
                evidenceTestMode: true,
                evidenceTestModeScope: "Vercel preview+production env vars (EVIDENCE_TEST_MODE=true set by this workflow)",
                hmacSignatureVerificationSkipped: true,
                hmacSkipReason: "X-Evidence-Skip-Verify=true header sent (only honored when EVIDENCE_TEST_MODE=true)",
                productionTouched: false,
                note: "4a evidence: 5 concurrent POST /api/webhooks/razorpay with same X-Razorpay-Event-Id + X-Razorpay-Event=payment.captured + X-Evidence-Skip-Verify=true + webhookHandler=true (FEATURE_WEBHOOK_HANDLER=true on Vercel). Test run against staging Supabase PostgreSQL (project ref zmzqqcyapcezmaqvuzzd). realPayments=false (demo mode). HMAC verification SKIPPED via X-Evidence-Skip-Verify=true header (only honored under EVIDENCE_TEST_MODE=true). No production traffic touched. Verifies webhook dedup (WebhookEvent.eventId unique constraint) + idempotent Payment capture (optimistic-lock version) + atomic Outbox event (PAYMENT_CAPTURE_CONFIRMED) + >=2 audit logs (WEBHOOK_RECEIVED + WEBHOOK_PAYMENT_CAPTURED). P0-05 / I-04."
              },
              concurrentResponses: $responses
            }' > "$EVIDENCE_FILE"

          echo "=== Evidence JSON ==="
          cat "$EVIDENCE_FILE" | jq '.'

          echo ""
          echo "=== Step 10: Cleanup test data ==="
          # Delete ALL test data created by this workflow (test step + any stragglers
          # from the staging health check that also called evidence-setup):
          #   - WebhookEvent rows for test payments (by paymentId FK)
          #   - Outbox rows for test payments + orders
          #   - OrderItem children of test orders
          #   - AuditLog rows with action LIKE 'WEBHOOK_%' AND metadata contains eventId/paymentId
          #   - Payment rows for test user
          #   - Order rows for test user
          # The test user (phone +919999900003) is left for reuse across runs.
          CLEANUP_SQL=$(printf 'DELETE FROM "WebhookEvent" WHERE "paymentId" IN (SELECT "id" FROM "Payment" WHERE "userId" = '\''%s'\''); DELETE FROM "Outbox" WHERE "aggregateType" = '\''Payment'\'' AND "aggregateId" IN (SELECT "id" FROM "Payment" WHERE "userId" = '\''%s'\''); DELETE FROM "Outbox" WHERE "aggregateType" = '\''Order'\'' AND "aggregateId" IN (SELECT "id" FROM "Order" WHERE "userId" = '\''%s'\''); DELETE FROM "OrderItem" WHERE "orderId" IN (SELECT "id" FROM "Order" WHERE "userId" = '\''%s'\''); DELETE FROM "AuditLog" WHERE "action" LIKE '\''WEBHOOK_%%'\'' AND ("metadata" LIKE '\''%%%s%%'\'' OR "metadata" LIKE '\''%%%s%%'\''); DELETE FROM "IdempotencyKey" WHERE "key" LIKE '\''ev-pg-concurrent-4a-%%'\''; DELETE FROM "Payment" WHERE "userId" = '\''%s'\''; DELETE FROM "Order" WHERE "userId" = '\''%s'\'';' \
            "$USER_ID" "$USER_ID" "$USER_ID" "$USER_ID" "$EVENT_ID" "$PAYMENT_ID" "$USER_ID" "$USER_ID")
          echo "Cleaning up test data for user: $USER_ID (eventId=$EVENT_ID, paymentId=$PAYMENT_ID)..."
          CLEANUP_RESULT=$(curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d "$(jq -n --arg q "$CLEANUP_SQL" '{query: $q}')")
          echo "Cleanup response: $(echo $CLEANUP_RESULT | head -c 300)"
          echo "✅ Cleanup complete"

          echo ""
          echo "=================================================="
          echo "  EVIDENCE SUMMARY"
          echo "=================================================="
          echo "Run ID: $RUN_ID"
          echo "Database: PostgreSQL (staging Supabase)"
          echo "ok: $EXACTLY_ONE_WEBHOOK"
          echo "Concurrent webhook requests: $CONCURRENCY"
          echo "Unique webhook event IDs: $UNIQUE_WEBHOOK_EVENTS (expected: 1)"
          echo "WebhookEvent count: $WEBHOOK_EVENT_COUNT (expected: 1)"
          echo "WebhookEvent.processedBy stored: $PROCESSED_BY_STORED (expected: true — 4a schema delta)"
          echo "Payment captured: $PAYMENT_CAPTURED (expected: true)"
          echo "Payment status: $PAYMENT_DB_STATUS (expected: CAPTURED)"
          echo "Outbox event count: $OUTBOX_COUNT (expected: 1 — PAYMENT_CAPTURE_CONFIRMED)"
          echo "Audit log count (WEBHOOK_*): $AUDIT_COUNT (expected: >=2)"
          echo "422 responses: $COUNT_422 (expected: 0)"
          echo "Responses: processed=$COUNT_PROCESSED, duplicate=$COUNT_DUPLICATE, conflict-resolved=$COUNT_CONFLICT"
          echo "=================================================="

          if [ "$EXACTLY_ONE_WEBHOOK" != "true" ]; then
            echo "❌ EVIDENCE FAILED — invariant violated"
            exit 1
          fi
          echo "✅ EVIDENCE PASSED — exactly 1 WebhookEvent + 1 Payment CAPTURED from 5 concurrent POST /api/webhooks/razorpay on PostgreSQL with webhookHandler=true (4a)"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave4-4a-postgresql-concurrent-evidence
          path: wave4-4a-postgresql-evidence.json
          retention-days: 90
